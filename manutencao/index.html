<script>
const NUVEM_PADRAO = 'https://script.google.com/macros/s/AKfycbwXXNSYq-wClpZQrOR0LasSxyr_56gdFIK8wEAyeD-Vbh8rfJ0lhNZZlbT29hJ8enKA/exec';   // planilha CTLE_MAN: todo aparelho novo já abre ligado à nuvem
/* bibliotecas de PDF (html2canvas 1.4.1, jsPDF 2.5.1) ficam em lib/ e só carregam ao gerar um PDF; o sw.js guarda as duas para funcionar sem internet */
let LIBS_PDF = null;
function carregarLibsPdf() {
  if (window.jspdf && window.html2canvas) return Promise.resolve();
  const js = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error('não carregou ' + src)); document.head.appendChild(s); });
  return LIBS_PDF || (LIBS_PDF = Promise.all([js('lib/html2canvas.min.js'), js('lib/jspdf.umd.min.js')]).catch(e => { LIBS_PDF = null; throw e; }));
}
</script>
<style>
/* Layout: barra lateral azul-marinho (igual ao CTLE_LUB) + área clara de trabalho; documentos A4 renderizados à parte.
   Tema único claro, mantendo a identidade do CTLE_LUB (escolha deliberada). */
:root{
  color-scheme:light;
  --bg:#EEF2F7; --solid:#FFFFFF; --ink:#14233B; --mut:#6B7A92; --line:#E4EAF3; --line2:#D3DCE5;
  --side:#0B1F3A; --side2:#12305A; --side-ink:#C9D6EA; --acc:#1A73E8; --acc2:#4285F4;
  --ok:#1E8E3E; --okb:#E6F4EA; --okt:#137333; --warn:#F9AB00; --warnb:#FDF2D9; --warnt:#B06000; --bad:#D93025; --badb:#FFFFFF; --badt:#C5221F;
  --ice:#F4F7FA; --ice2:#EAF0F5; --navy:#1F3A5F; --blue:#1A73E8; --bb:#D93025; --be:#2E9B5A;
  --f:"Segoe UI",Inter,system-ui,Arial,sans-serif; --fd:"Google Sans Flex","Segoe UI",Arial,sans-serif; --fm:Consolas,"Courier New",monospace;
  --shadow:0 1px 2px rgba(16,35,66,.05),0 8px 24px rgba(16,35,66,.06);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f);font-size:14px;line-height:1.45}
button{font-family:inherit}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* ---------- barra lateral ---------- */
.side{background:linear-gradient(180deg,var(--side),var(--side2));color:var(--side-ink);padding:16px 12px 14px;padding-left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brandbox{background:#fff;border-radius:10px;padding:7px;display:flex;align-items:center;justify-content:center;gap:10px}
.brandbox img{height:28px;width:auto}.brandbox i{width:1px;height:24px;background:#D5DEEB}
.bt{display:flex;gap:9px;align-items:center;padding:2px 4px}
.bt .logo{width:34px;height:34px;border-radius:9px;background:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.bt b{display:block;color:#fff;font-size:15px;letter-spacing:.03em}.bt span{font-size:11.5px}
.grp-t{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#7F95B5;margin:8px 10px 0}
.side a{display:flex;align-items:center;gap:9px;color:var(--side-ink);text-decoration:none;padding:7px 10px;border-radius:8px;font-size:13.5px}


.side a .n{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.side a .n.blue{background:var(--acc)}
.side .user{margin-top:auto;display:flex;gap:9px;align-items:center;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.side .av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.side .user b{display:block;color:#fff;font-size:13px}.side .user span{font-size:11.5px}
.side .user button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:4px 8px;font-size:12px;cursor:pointer}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;padding:0 10px}
.sync i{width:8px;height:8px;border-radius:50%;background:#7F95B5;flex:none}
.sync.ok i{background:#3DD68C}.sync.pend i{background:#F2B33D}.sync.err i{background:#FF6B57}
/* ---------- topo mobile ---------- */
.mtop{display:none}
/* ---------- área principal ---------- */
.main{min-width:0;padding-block:18px 60px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.banner{border-radius:10px;padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.ex{background:var(--warnb);color:var(--warnt);border:1px solid #EFD9A8}
.banner.info{background:#E3EEFA;color:var(--acc);border:1px solid #C8DCF2}
.banner.bad{background:var(--badb);color:var(--badt);border:1px solid #F3C4BA}
.banner .sp{flex:1}
.vh{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.vh h1{margin:0;font-size:24px;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}.vh p{margin:3px 0 0;color:var(--mut);max-width:80ch}
.vh .sp{flex:1}
.card{background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{margin:0;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.card.row{flex-direction:row;align-items:flex-end}
a.mbtn{text-decoration:none}
.sp{flex:1}
.mbtn{font-size:13px;font-weight:600;border:1px solid var(--line2);background:var(--solid);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}


.mbtn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.mbtn.bad{color:var(--badt);border-color:#F0B8AD}
.mbtn.sm{padding:4px 9px;font-size:12px}
.mbtn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:12px;padding:1px 8px;white-space:nowrap}
.p-ok{background:var(--okb);color:var(--okt)}.p-warn{background:var(--warnb);color:var(--warnt)}.p-bad{background:var(--badb);color:var(--badt)}.p-inf{background:#E3EEFA;color:var(--acc)}.p-mut{background:var(--ice2);color:var(--mut)}.p-navy{background:var(--navy);color:#fff}
.pos{display:inline-flex;align-items:center;gap:5px;font-family:var(--fm);font-size:12px;font-weight:700}
.pos::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--mut))}
.pos.BB{--c:var(--bb)}.pos.BE{--c:var(--be)}.pos.CE{--c:var(--navy)}.pos.MCA1,.pos.MCA2,.pos.MCA3{--c:var(--acc)}.pos.UN{--c:var(--navy)}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.note{font-size:12.5px;color:var(--mut)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;min-width:0}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--ice);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--navy)}
input[readonly]{background:var(--ice2);color:var(--navy);font-weight:600}
textarea{resize:vertical}
.g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.s1{grid-column:span 1}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
.opts{display:flex;flex-wrap:wrap;gap:4px 14px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink);padding-top:5px}
.opts label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--solid);position:sticky;top:0}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--ice)}
table.t td.r,table.t th.r{text-align:right}
.empty{padding:26px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:10px;background:var(--solid)}
/* KPIs */
.kgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kgrid.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.kc{display:flex;flex-direction:column;gap:6px}
.kc .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.kc h3{margin:0;font-size:14px}
.kc .meta{font-size:11.5px;color:var(--mut)}
.kc .val{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kc .val small{font-size:14px;color:var(--mut);font-weight:600;margin-left:3px}
.kc .formula{font-size:11px;color:var(--mut);border-top:1px solid var(--line);padding-top:6px}
.mini{display:flex;flex-direction:column;gap:2px;padding:12px 14px}
.mini b{font-size:26px;line-height:1;font-variant-numeric:tabular-nums}.mini span{font-size:12px;color:var(--mut)}
.mini.bad b{color:var(--bad)}.mini.warn b{color:var(--warn)}.mini.ok b{color:var(--ok)}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{fill:var(--mut);font-family:var(--fm);font-size:9.5px}
svg.ch .grid{stroke:var(--line);stroke-width:1}

svg.ch .ln{fill:none;stroke:var(--acc);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}


svg.ch .hit{fill:transparent;cursor:crosshair}
svg.ch .bar{fill:var(--acc)}

svg.ch .mt{fill:var(--warnt);font-size:9.5px}
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:5px 8px;border-radius:6px;font-family:var(--fm);white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
/* frota */




.hrs{display:grid;grid-template-columns:auto 1fr auto;gap:3px 10px;font-size:12.5px;align-items:center}
.hrs .mono{text-align:right}


/* kanban */
.kan{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--ice2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:210px}
.col h4{margin:0;font-size:13px;display:flex;justify-content:space-between;text-transform:uppercase;letter-spacing:.05em;color:var(--navy)}
.omc{background:var(--solid);border:1px solid var(--line);border-left:4px solid var(--c,var(--line2));border-radius:9px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.omc .h{display:flex;justify-content:space-between;gap:6px;align-items:center}
.omc b.num{font-family:var(--fm);font-size:14px}
.omc .acts{display:flex;gap:5px;flex-wrap:wrap}
/* formulário de OM */
.work{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:16px;align-items:start}
.formcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--navy)}
.sec-h code{background:var(--navy);color:#fff;border-radius:4px;padding:1px 6px;font-family:inherit;letter-spacing:0}
.sec-h .r{margin-left:auto;font-weight:400;text-transform:none;letter-spacing:0;color:var(--mut)}
.item{border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.item-h{background:var(--ice);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line2)}
.item-h b{font-size:13.5px}.item-h .num{font-family:var(--fm);font-weight:700;color:var(--blue)}
.item-b{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.spec{font-size:12.5px;background:#F7FAFD;border-left:3px solid var(--blue);padding:6px 10px;border-radius:0 6px 6px 0}
.chk{display:flex;flex-direction:column;gap:2px}
.chk label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer;padding:2px 0}
.chk input{width:16px;height:16px;margin-top:2px;flex:none;accent-color:var(--ok)}
.chk label.dn span{color:var(--mut);text-decoration:line-through;text-decoration-color:#9FB0C6}
table.meds{width:100%;border-collapse:collapse;font-size:12.5px}
table.meds th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line2);font-weight:600}
table.meds td{padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.meds td input{padding:5px 7px}
table.meds tr.out input.dv{border-color:var(--bad);background:var(--badb);color:var(--badt)}
.xbtn{border:1px solid var(--line2);background:var(--solid);border-radius:7px;cursor:pointer;color:var(--badt);font-weight:700;width:32px;height:32px;flex:none}
.extrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) 32px;gap:8px;background:var(--ice);border:1px solid var(--line2);border-radius:9px;padding:9px}
.extrow .full{grid-column:1 / 3}
.extrow .xbtn{grid-row:1;grid-column:3;align-self:end}
.phgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.phc{border:1px solid var(--line2);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--solid)}
.phc .img{aspect-ratio:4/3;max-width:100%;background:var(--ice);position:relative}
.phc .img img{width:100%;height:100%;object-fit:cover;display:block}
.phc .img .no{position:absolute;top:6px;left:6px;background:rgba(11,31,58,.8);color:#fff;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px}
.phc .meta{padding:8px;display:grid;grid-template-columns:104px minmax(0,1fr) 32px;gap:6px;align-items:center}
.addph{position:relative;border:2px dashed var(--line2);border-radius:10px;aspect-ratio:4/3;max-width:100%;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;color:var(--acc);font-weight:600;cursor:pointer;background:var(--ice)}
.addph small{color:var(--mut);font-weight:400}.addph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.gate{display:flex;flex-direction:column;gap:4px;font-size:13px}
.gate div{display:flex;gap:8px;align-items:center}
.ck{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex:none}
.ck.y{background:var(--okb);color:var(--okt)}.ck.n{background:var(--badb);color:var(--badt)}
.stepsbar{display:flex;background:var(--solid);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.stepsbar div{flex:1;padding:9px 12px;font-size:12.5px;color:var(--mut);display:flex;gap:7px;align-items:center;min-width:0}
.stepsbar div+div{border-left:1px solid var(--line)}
.stepsbar b{width:20px;height:20px;border-radius:50%;background:var(--ice2);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:11px;flex:none}
.stepsbar .done b{background:var(--ok);color:#fff}.stepsbar .cur{color:var(--ink);font-weight:600}.stepsbar .cur b{background:var(--acc);color:#fff}
.pdfcol{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pdfbar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);gap:8px;flex-wrap:wrap}
.pdfwrap{background:#596474;border-radius:12px;padding:12px;overflow:auto;max-height:calc(100vh - 110px);display:flex;flex-direction:column;gap:12px;align-items:center}
.pv{position:relative;flex:none;box-shadow:0 4px 18px rgba(0,0,0,.35);overflow:hidden}
.pv>.sheet{position:absolute;left:0;top:0;transform-origin:0 0}
.triage{display:flex;flex-direction:column;gap:10px}
.triage .q{border:1px solid var(--line2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.triage .q b{font-size:13.5px}
.cls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cls div{border:2px solid var(--line2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.cls div b{font-size:15px}
.cls div.on{border-color:var(--c);background:var(--cb)}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(11,31,58,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.modal .box{background:var(--solid);border-radius:14px;width:100%;max-width:560px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .box.wide{max-width:980px}
.modal h2{margin:0;font-size:18px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--solid)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--mut)}

.skt{font-family:var(--fm);font-size:12.5px;white-space:pre-wrap;background:var(--solid);border:1px solid var(--line2);border-radius:8px;padding:10px}
.sk{display:flex;flex-direction:column;gap:10px;background:var(--ice);border:1px dashed var(--acc);border-radius:10px;padding:12px}

/* ===================== DOCUMENTOS A4 (PDF) ===================== */
#render{position:fixed;left:-10000px;top:0}
.sheet{width:794px;height:1123px;background:#F4F7FA;color:#1D2B3A;font-family:var(--fd);font-size:10.4px;line-height:1.38;padding:30px 42px 26px;display:flex;flex-direction:column;overflow:hidden}
.sheet .body{flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.sheet .hdr{display:grid;grid-template-columns:120px 1fr 120px;border:.6px solid #B9C5D1;background:#fff;margin-bottom:9px;flex:none}
.sheet .hdr div{display:flex;align-items:center;justify-content:center;padding:5px}
.sheet .hdr .c{flex-direction:column;border-left:.6px solid #B9C5D1;border-right:.6px solid #B9C5D1;text-align:center}
.sheet .hdr img.ln{height:38px;width:auto}.sheet .hdr img.lv{height:46px;width:auto}
.sheet .hdr b{color:#1F3A5F;font-size:11.5px;font-weight:600}.sheet .hdr span{color:#5E6E7F;font-size:10px}.sheet .hdr .np{color:#1A73E8;font-size:9.5px}

.lb.min>.card>*:not(:first-child){display:none!important}

.pmax{position:fixed;inset:0;z-index:300;background:rgba(11,25,45,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:3vh 3vw}

const COMP = { pad: 1.8, aten: 1.45, lim: 1.27, queda: 0.15, cobMeses: 24 };

function compHist(vid, pos) {

  oms().forEach(o => {
    if (o.tipo !== 'P' || o.status !== 'encerrada' || o.vessel !== vid || o.pos !== pos) return;
    const date = o.dreal || isoD(new Date(o.fechadoAt || o.updatedAt));
    if ((o.items || []).includes('1.1.12')) { const md = ((o.conf || {})['1.1.12'] || {}).meds || []; const vals = [1, 2, 3, 4, 5, 6].map(i => numBR((md[i] || {}).dei ?? (md[i] || {}).enc)); if (vals.some(x => x != null)) L.push({ date, h: o.hreal, vals, rpm: numBR((md[7] || {}).dei ?? (md[7] || {}).enc), src: 'OM ' + o.num, om: o.id }); }
    if ((o.items || []).includes('1.1.28')) { const md = ((o.conf || {})['1.1.28'] || {}).meds || []; const x = numBR((md[0] || {}).dei ?? (md[0] || {}).enc); if (x != null) L.push({ date, h: o.hreal, vals: [x], src: 'OM ' + o.num + ' (menor cilindro)', om: o.id }); }
  });
  L.forEach(p => { const v = p.vals.filter(x => x != null); p.min = Math.min(...v); p.cil = p.vals.indexOf(p.min) + 1; p.max = Math.max(...v); });
  return L.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (+a.h || 0) - (+b.h || 0));
}
function saudeMCP(v, pos) {
  const H = compHist(v.id, pos), u = H[H.length - 1] || null, a = H[H.length - 2] || null;
  const queda = u && a ? a.min - u.min : null;
  let st = 'sem', txt = 'Sem medição de compressão';
  if (u) {
    if (u.min < COMP.lim) { st = 'venc'; txt = 'Avaliar overhaul: cilindro ' + u.cil + ' abaixo do limite'; }
    else if (u.min < COMP.aten) { st = 'viag'; txt = 'Atenção: cilindro ' + u.cil + ' perto do limite'; }
    else if (queda != null && queda >= COMP.queda) { st = 'viag'; txt = 'Atenção: queda de ' + fMPa(queda) + ' MPa desde a última medição'; }

  const mesesOleo = oleo ? Math.floor((hoje() - pD(oleo.date)) / (864e5 * 30.4)) : null;
  const cobVenc = !oleo || mesesOleo >= COMP.cobMeses;
  return { v, pos, H, u, a, queda, st, txt, ov, desdeOv, oleo, mesesOleo, cobVenc, omOleo: omAberta(v.id, pos, '1.1.29') };
}
function overDados() { const out = []; S.cfg.frota.forEach(v => mcpPos(v).forEach(pos => { if ((v.off || []).includes('MCP')) return; out.push(saudeMCP(v, pos)); })); return out.filter(x => !foraOp(x.v || (x.vessel && vessel(x.vessel)))); }

// dados de exemplo da compressão (só para a demonstração; somem em "Limpar dados de exemplo")
function exemploComp() {
  const R = rnd(7031); let out = [];
  S.cfg.frota.forEach((v, i) => mcpPos(v).forEach((pos, j) => {
    const b = recs('base').find(r => r.vessel === v.id && r.pos === pos && r.item === '1.1.12' && r.seed); const hr = horAtual(v.id, pos);
    if (!b || !hr) return;
    const k = i * 2 + j, base = 1.68 + R() * 0.12, taxa = [0.05, 0.03, 0.09, 0.02, 0.04, 0.16, 0.03, 0.06][k % 8];
    const fraco = k === 5 ? 0.30 : k === 2 ? 0.16 : k === 9 ? 0.2 : 0;
    for (let n = 2; n >= 0; n--) {
      const h = b.h - n * 1000; if (h <= 0) continue;
      const dt = pD(b.date); dt.setDate(dt.getDate() - n * 105);
      const vals = [0, 1, 2, 3, 4, 5].map(c => (base - (2 - n) * taxa - (c === 3 ? fraco * (3 - n) / 3 : 0) - R() * 0.05).toFixed(2).replace('.', ','));
      out.push({ id: 'ex-comp-' + v.id + pos + n, kind: 'comp', vessel: v.id, pos, date: isoD(dt), h, vals, rpm: '120', seed: true });
    }
    out.push({ id: 'ex-base-' + v.id + pos + '1.1.28', kind: 'base', vessel: v.id, pos, item: '1.1.28', h: Math.max(150, hr.h - 4000 - Math.round(R() * 6000)), date: isoD(addM(hoje(), -24 - Math.round(R() * 30))), seed: true });
  }));
  const ativo = m => { const v = vessel(m.split('|')[0]); return v && !(typeof foraOp === 'function' && foraOp(v)); };   // casos de exemplo: fora do limite, atenção, vencido, sem ensaio
  const mot = [...new Set(out.filter(r => r.kind === 'comp').map(r => r.vessel + '|' + r.pos))].filter(ativo);
  const de = k => out.filter(r => r.kind === 'comp' && r.vessel + '|' + r.pos === mot[k]).sort((a, b) => a.h - b.h), br = x => x.toFixed(2).replace('.', ',');
  if (mot[0]) { const L = de(0); L[L.length - 1].vals[3] = '1,21'; }                                                     // fora do limite (cil. 4)
  if (mot[3]) de(3).forEach((r, i) => { r.vals = [1.80, 1.50 - i * 0.005, 1.79, 1.80, 1.78, 1.80].map(br); });           // atenção: cil. 2 ~0,3 MPa abaixo dos outros (acima de 0,18), estável
  if (mot[6]) de(6).forEach(r => { if (r.h - 1400 > 0) r.h -= 1400; });                                                  // ensaio vencido
  if (mot[8]) out = out.filter(r => !(r.kind === 'comp' && r.vessel + '|' + r.pos === mot[8]));                           // sem ensaio
  return out;
}

/* ---------- tela da OM ---------- */
let OMV = { id: null, prevT: null };
/* OM num bloco só (24/10/2026): faixa-guia · eletrônicos de navegação (corretiva) · origem · OM (com a verificação de eficácia) · histórico.
   Antes eram 4 camadas por cima do corpo da OM. */
function vOM() {
  const o = S.recs.get(ARG); let h = omCorpo();
  if (!o) return h;
  const ef = omEficaciaHTML(o); if (ef) h = h.replace('<div class="work">', ef + '<div class="work">');
  h = omOrigemHTML(o) + h + omHistHTML(o);
  if (o.kind !== 'om') return h;
  h = guiaOM(o, o.grupo ? omGrupo(o.grupo) : [o]) + h;
  const c = o.tipo === 'C' && typeof tiCard === 'function' ? tiCard(o) : '';
  if (c) { const t = document.createElement('div'); t.innerHTML = h; const gu = t.querySelector('.card.gu'); if (gu) gu.insertAdjacentHTML('afterend', c); else t.insertAdjacentHTML('afterbegin', c); h = t.innerHTML; }
  return h;
}
function omCorpo() {
  const o = S.recs.get(ARG); if (!o) return '<div class="empty">OM não encontrada. Talvez ainda não tenha sincronizado.</div>';
  OMV.id = o.id;
  const fechada = o.status === 'encerrada';
  const et = o.tipo === 'C' ? ETAPAS_C : ETAPAS_P, idx = et.findIndex(x => x[0] === o.status);
  const bar = `<div class="stepsbar">${et.map(([k, l], i) => `<div class="${i < idx || fechada ? 'done' : i === idx ? 'cur' : ''}"><b>${i < idx || fechada ? '✓' : i + 1}</b>${l}</div>`).join('')}</div>`;

}

    ${fIn(o, 'hreal', 'Horímetro realizado (h)', 's2', 'inputmode="numeric"')}${fDT(o, 'dreal', 'Data realizada', 's2', 'date')}${fIn(o, 'indispH', 'Embarcação indisponível (h)', 's2', 'inputmode="decimal" placeholder="0 se operou"')}

   <div class="card">${sec('B6', 'Resíduos', 'item 5.7')}<div class="g">${fRad(o, 'resid', 'Gerou resíduo?', ['Não', 'Sim'], 's2')}${fMul(o, 'residT', 'Tipos', ['Óleo usado', 'Filtros', 'Estopas/panos', 'Metais', 'Outros'], 's4')}${fIn(o, 'fr016', 'Nº FR 016_E', 's2')}</div></div>

   ${pred ? `<div class="card">${sec('B8', 'Manutenção preditiva', 'itens 1.1.29 / 1.1.30')}${tabelaLivre(o, 'predRows', 'Parâmetros monitorados', ['Parâmetro monitorado', 'Valor atual', 'Valor anterior', 'Limite de alerta', 'Tendência (estável / degradando / crítica)'])}
    <div class="g">${fDT(o, 'predProxD', 'Próxima medição — data', 's2', 'date')}${fIn(o, 'predProxH', 'ou horímetro (h)', 's2')}${fRad(o, 'predGera', 'Gera intervenção?', ['Não', 'Sim'], 's2')}${fIn(o, 'predOM', 'Nº da nova OM', 's2')}${fIn(o, 'laudo', 'Nº do laudo do laboratório', 's4')}</div></div>` : ''}
   <div class="card">${sec('B10', 'Registro fotográfico', 'item 5.8 · 4 fotos por folha no PDF')}${fotosHtml(o)}</div>
   <div class="card">${sec('B9', 'Liberação e assinaturas')}<div class="g">${fIn(o, 'ass|exec', 'Executor (nome)', 's3')}${fIn(o, 'ass|cmd', 'Recebido a bordo — Comandante ou Coordenador de Operações (4.7)', 's3')}${fDT(o, 'liberacao', 'Liberação à Operação', 's3')}${fIn(o, 'conferencia', 'Conferência documental (Analista) — nome e data', 's3')}</div>
    ${aprovacaoHtml(o)}</div><div class="card">${sec('HH', 'Horas-homem e custo', 'apropriação de mão de obra e custos (KPI)')}<div class="g">${fIn(o, 'hh', 'Horas-homem (HH)', 's2', 'inputmode="decimal"')}${fIn(o, 'custoMat', 'Peças e materiais (R$)', 's2', 'inputmode="decimal"')}${fIn(o, 'custoServ', 'Serviço de terceiro (R$)', 's2', 'inputmode="decimal"')}</div></div>`;
}
function tabelaLivre(o, k, tit, cols) {
  const rows = getPath(o, k) || [];
  return `<div class="sec-h" style="margin-top:4px">${tit}<span class="r"><button class="mbtn sm" data-addrow="${k}|${cols.length}">+ Linha</button></span></div>
   ${rows.length ? `<div class="tw"><table class="meds"><thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map((r, i) => `<tr>${cols.map((c, j) => `<td><input data-k="${k}|${i}|${j}" value="${esc(r[j] || '')}"></td>`).join('')}<td><button class="xbtn" data-delrow="${k}|${i}" aria-label="Remover linha">✕</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="note">Nenhuma linha.</div>'}`;
}
function extrasHtml(o) {

   ${ex.map((x, i) => `<div class="extrow"><label class="f">Sistema (lista fixa 7.1)<select data-k="extras|${i}|sis"><option value="">Escolha…</option>${SISTEMAS.map(s => `<option${s === x.sis ? ' selected' : ''}>${s}</option>`).join('')}</select></label>
     <label class="f">Equipamento / local<input data-k="extras|${i}|eq" value="${esc(x.eq || '')}"></label><button class="xbtn" data-delrow="extras|${i}" aria-label="Remover serviço">✕</button>
     <label class="f full">O que foi feito<textarea data-k="extras|${i}|desc" rows="2">${esc(x.desc || '')}</textarea></label><label class="f full">Material aplicado / RM<input data-k="extras|${i}|mat" value="${esc(x.mat || '')}"></label></div>`).join('')}
   <button class="mbtn sm" data-addextra style="align-self:flex-start">+ Acrescentar serviço fora do Anexo I</button>`;

function fotosHtml(o) {

   <div class="phgrid">${f.map((x, i) => `<div class="phc"><div class="img">${x.src ? `<img src="${x.src}" alt="Foto ${i + 1}">` : '<div class="note" style="padding:20px">Foto no PDF do Drive</div>'}<span class="no">Foto ${i + 1}</span>${x.fid ? '<span class="ph-nv ok" title="Cópia guardada no Google Drive">☁ no Drive</span>' : x.src ? '<span class="ph-nv" title="Sobe ao Drive quando houver sinal">só neste aparelho</span>' : ''}</div>
     <div class="meta"><select data-k="fotos|${i}|tipo">${['ANTES', 'DURANTE', 'DEPOIS'].map(t => `<option${t === x.tipo ? ' selected' : ''}>${t}</option>`).join('')}</select><input data-k="fotos|${i}|leg" placeholder="Legenda (o que mostra)" value="${esc(x.leg || '')}"><button class="xbtn" data-delrow="fotos|${i}" aria-label="Remover foto">✕</button></div></div>`).join('')}
    <label class="addph cam"><span style="font-size:28px;line-height:1">📷</span>Tirar foto<small>abre a câmera · vai direto para o formulário</small><input type="file" id="addFoto" accept="image/*" capture="environment"></label><label class="addph"><span style="font-size:28px;line-height:1">🖼</span>Da galeria<small>escolher uma ou várias fotos já tiradas</small><input type="file" id="addFoto" accept="image/*" multiple></label></div>`;
}
function gateIIB(o) {
  const g = [], F = fotosPrev(o);
  g.push(['Data da execução', !!o.dreal]);
  if (o.pos !== 'UN') g.push(['Horímetro na execução', !!o.hreal]);
  g.push(['Quem executou', !!(o.execn || '').trim()]);
  g.push(['Foto de antes', F.some(x => x.tipo === 'ANTES')]);
  g.push(['Foto de depois', F.some(x => x.tipo === 'DEPOIS')]);

}
function fotosGate(o, g) { const f = o.fotos || []; g.push(['Pelo menos uma foto ANTES', f.some(x => x.tipo === 'ANTES')]); g.push(['Pelo menos uma foto DEPOIS', f.some(x => x.tipo === 'DEPOIS')]); g.push(['Todas as fotos com legenda', f.length > 0 && f.every(x => (x.leg || '').trim())]); }
function aprovacaoHtml(o) {
  if (o.status === 'encerrada') return `<div class="banner info">Aprovada por <b>${esc(o.aprovBy || '')}</b> em ${new Date(o.fechadoAt).toLocaleString('pt-BR')}. ${o.pdfFileId ? 'PDF guardado no Drive.' : S.url ? (S.pdfPend[o.id] ? 'PDF aguardando envio para o Drive.' : '') : 'Modo local: o PDF foi baixado neste aparelho.'}</div>`;
  return `<div class="sec-h" style="margin-top:4px">Conferência do Supervisor</div><div class="gate" id="omGate"></div>

   ${o.tipo === 'P' ? '<input id="motivo" placeholder="Motivo da devolução" style="flex:1;min-width:160px"><button class="mbtn bad" data-act="devolver">↩ Devolver ao bordo</button>' : ''}</div>

}

/* ---------- II-A ---------- */
function gateIIA(o) {
  const g = [], crit = o.classe === 'Crítica', ca = ehCA(o), anexo = tercAnexo(o);
  g.push(['1 · Sistema e descrição da falha', !!o.sistema && !!(o.descricao || '').trim()]);
  if (ca) g.push(['1 · Nº da RNC', !!(o.rnc || '').trim()]);
  if (ca) g.push(['1 · Modo de falha', !!o.modo]);
  if (ca) g.push(['1 · Coordenação e Supervisão comunicadas', (o.comunicado || []).length === 2]);
  if (crit) g.push(['1 · Data e hora da interdição', !!o.interdDT]);
  if (ca) g.push(['2 · Ação de contenção descrita', !!(o.contencao || '').trim()]);
  g.push(['3 · Quem executou', !!o.exec && !!(o.execn || '').trim()]);
  if (o.exec === 'Terceiro') g.push(['3 · Autorização da Gerência e relatório do terceiro', (o.terceiroAut || '').startsWith('Sim') && !!o.relTerc]);
  g.push(['3 · Início e término do reparo', !!o.inicio && !!o.termino]);
  if (!anexo) g.push(['3 · Serviço executado', !!(o.servicos || '').trim()]);
  g.push(['3 · Resíduos (FR 016_E se gerou)', o.resid === 'Não' || (o.resid === 'Sim' && !!(o.fr016 || '').trim())]);
  g.push(['3 · Teste com resultado Conforme', o.resultado === 'Conforme']);
  g.push(['3 · Nova inspeção de segurança', !!(o.inspecao || '').trim()]);
  fotosGate(o, g);
  if (ca) g.push(['4 · Causa da falha e análise de causa raiz', !!o.causaCat && !!(o.causa || '').trim()]);
  if (ca) g.push(['4 · Ação, responsável e prazo', !!(o.mitig || '').trim() && !!(o.mitigResp || '').trim() && !!o.mitigPrazo]);
  if (crit) g.push(['5 · Liberação do Coordenador de Operações', !!((o.ass || {}).coord || '').trim()]);
  g.push(['5 · Data e hora da liberação', !!o.liberacao]);
  if (ehEletr(o)) g.push(['NP 5.12 · Alimentação elétrica verificada (Manutenção) e destino registrado', !!(o.ti && o.ti.res)]);
  return g;
}

/* ---------- ligação do formulário ---------- */
AFTER.om = () => {
  const o = S.recs.get(ARG); if (!o) return; const m = $('#main');
  const refresh = () => { const g = o.tipo === 'C' ? gateIIA(o) : gateIIB(o), ok = g.every(x => x[1]), el = $('#omGate');
    if (el) el.innerHTML = g.map(([l, y]) => `<div><span class="ck ${y ? 'y' : 'n'}">${y ? '✓' : '✕'}</span>${esc(l)}</div>`).join('') + (ok ? '<div class="note" style="color:var(--okt)">Tudo pronto para aprovar.</div>' : `<div class="note">Faltam ${g.filter(x => !x[1]).length} itens para liberar a aprovação.</div>`);
    const b = $('#btnAprovar'); if (b) b.disabled = !ok || !can.admin();
    const pz = $('#prazoB2'); if (pz) pz.innerHTML = o.hreal ? (o.alvoH ? (+o.hreal <= o.alvoH ? '<span class="pill p-ok">Dentro do prazo</span>' : '<span class="pill p-warn">Fora do prazo · justifique abaixo</span>') : '') : '';
    clearTimeout(OMV.prevT); OMV.prevT = setTimeout(() => { const pv = $('#pdfPrev'); if (pv) { const pg = o.tipo === 'C' ? docIIA(o) : docIIB(o); previewPages(pv, pg); $('#npg').textContent = pg.length + (pg.length === 1 ? ' página' : ' páginas'); } }, 350); };
  let saveT = null; const autosave = () => { clearTimeout(saveT); saveT = setTimeout(() => { if (o.status !== 'encerrada' && can.edit()) saveRec(o); }, 900); };
  const redraw = () => { const y = scrollY, a = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null; $('#omForm').innerHTML = o.tipo === 'C' ? formIIA(o) : formIIB(o); refresh(); scrollTo(0, y); if (a) { const e = $(`[data-k="${CSS.escape(a)}"]`); if (e && e.type !== 'radio') e.focus({ preventScroll: true }); } };
  const setFrom = t => { if (t.dataset.k) { let v = t.type === 'checkbox' ? t.checked : t.value; setPath(o, t.dataset.k, v); return true; } if (t.dataset.km) { const cur = getPath(o, t.dataset.km) || []; const s = new Set(cur); t.checked ? s.add(t.value) : s.delete(t.value); setPath(o, t.dataset.km, [...s]); return true; } return false; };
  m.oninput = e => { const t = e.target; if (t.type === 'file') return; if (setFrom(t)) { if (t.dataset.mf) { const [id, i] = t.dataset.mf.split('|'); t.closest('tr').classList.toggle('out', medFora(A1M[id].meds[+i], t.value)); } refresh(); autosave(); } };
  m.onchange = async e => { const t = e.target;
    if (t.id === 'addFoto') { for (const f of t.files) { const src = await comprimir(f); o.fotos = o.fotos || []; o.fotos.push({ src, tipo: o.fotos.some(x => x.tipo === 'ANTES') ? 'DEPOIS' : 'ANTES', leg: '', at: Date.now() }); } redraw(); autosave(); return; }
    if (t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT') { setFrom(t); if (t.dataset.k && /^(exec|relTerc|revPlano)$/.test(t.dataset.k) || (t.dataset.k || '').includes('steps')) redraw(); else refresh(); autosave(); } };
  m.onclick = async e => {

async function comprimir(file) { const url = URL.createObjectURL(file); const img = new Image(); await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; }); const M = 1400, k = Math.min(1, M / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); return c.toDataURL('image/jpeg', .78); }

const FOOT = n => `<div class="sf"><span>Documento controlado pelo SGI · gerado pelo SMF ${VERSAO_APP}</span><span>Página <b>${n}</b> de <b>@N</b></span></div>`;
const dv = (lab, v, span) => `<div${span ? ` style="grid-column:span ${span}"` : ''}><span class="fl">${lab}</span><div class="v">${esc(v == null ? '' : v) || '&nbsp;'}</div></div>`;
const blk = (code, t, r, inner) => `<div class="fs"><h4><code>${code}</code>${t}${r ? `<span class="r">${r}</span>` : ''}</h4>${inner}</div>`;
const grid = (cols, cells) => `<div class="row" style="grid-template-columns:${cols}">${cells}</div>`;
function tbl(cols, rows, w) { return `<table><tr>${cols.map((c, i) => `<th${w && w[i] ? ` style="width:${w[i]}"` : ''}>${c}</th>`).join('')}</tr>${rows.map(r => `<tr>${r.map(c => typeof c === 'object' && c ? `<td class="${c.c || ''}">${c.h !== undefined ? c.h : esc(c.t)}</td>` : `<td>${esc(c == null ? '' : c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${cols.length}" style="color:#8A98A8">N/A</td></tr>`}</table>`; }
function paginar(fbarHtml, blocks, hdrHtml) {
  const R = $('#render'); const pages = [];
  let sh = null, body = null;
  const nova = () => { sh = document.createElement('div'); sh.className = 'sheet'; sh.innerHTML = (hdrHtml || HDR()) + `<div class="body">${fbarHtml}</div>` + FOOT(pages.length + 1); R.appendChild(sh); body = sh.querySelector('.body'); pages.push(sh); };
  nova();
  const over = () => body.scrollHeight > body.clientHeight + 1;
  // divide a última tabela do bloco entre páginas quando ela não cabe inteira
  const dividir = el => {
    const linhas = t => [...t.querySelectorAll('tr')].filter(r => !r.querySelector('th'));
    const tabs = [...el.querySelectorAll(':scope > table')]; if (!tabs.length) return null;
    const t = tabs.reduce((a, b) => linhas(b).length > linhas(a).length ? b : a), dados = linhas(t);
    if (dados.length < 3) return null;
    const cont = el.cloneNode(false); const h = el.querySelector('h4');
    if (h) { const h2 = h.cloneNode(true); const r = h2.querySelector('.r'); if (r) r.textContent = 'continuação'; else h2.insertAdjacentHTML('beforeend', '<span class="r">continuação</span>'); cont.appendChild(h2); }
    const t2 = t.cloneNode(false), cab = t.querySelector('tr'), temCab = cab && cab.querySelector('th'); if (temCab) t2.appendChild(cab.cloneNode(true)); cont.appendChild(t2);
    const depois = []; let n = t.nextElementSibling; while (n) { depois.push(n); n = n.nextElementSibling; }
    depois.forEach(x => cont.appendChild(x));
    const mov = [];
    while (over() && dados.length - mov.length > 2) { const r = dados[dados.length - 1 - mov.length]; mov.push(r); t2.insertBefore(r, temCab ? t2.children[1] || null : t2.firstChild); }
    if (over()) { const tb = t.tBodies[0] || t; mov.slice().reverse().forEach(r => tb.appendChild(r)); depois.forEach(x => el.appendChild(x)); return null; }
    return cont;
  };
  const colocar = el => {
    body.appendChild(el);
    if (!over()) return;
    if (body.children.length > 2) { const c = dividir(el); if (c) { nova(); colocar(c); return; } el.remove(); nova(); body.appendChild(el); if (over()) { const c2 = dividir(el); if (c2) { nova(); colocar(c2); } } }
    else { const c = dividir(el); if (c) { nova(); colocar(c); } }
  };
  blocks.forEach(b => { const w = document.createElement('div'); w.innerHTML = b; colocar(w.firstElementChild); });
  const out = pages.map(p => p.outerHTML); pages.forEach(p => p.remove()); return out;
}
function numerar(pages) { const N = pages.length; return pages.map((p, i) => p.replace(/@N/g, N).replace(/Página <b>[^<]*<\/b>/, 'Página <b>' + (i + 1) + '</b>')); }

  return tbl(['Função', 'Nome', 'Assinatura', 'Data e hora'], rows, ['40%', '22%', '22%', '16%']);
}

function previewPages(cont, pages, w) {

async function gerarPDF(pages) {
  await carregarLibsPdf().catch(() => { });
  if (!window.jspdf || !window.html2canvas) throw new Error('bibliotecas de PDF não carregaram (sem internet?)');
  const { jsPDF } = window.jspdf, pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true }), R = $('#render');

/* ---------- TREINAMENTOS (NP 055 item 10) ---------- */
function treinPessoas() {
  const P = {};
  recs('trein').forEach(r => { const k = r.pessoa.trim().toLowerCase(); const p = P[k] || (P[k] = { nome: r.pessoa.trim(), funcao: r.funcao, barco: r.barco, L: [] }); p.L.push(r); if (r.data >= (p.ult || '')) { p.ult = r.data; p.funcao = r.funcao || p.funcao; p.barco = r.barco || p.barco; } });
  return Object.values(P).map(p => {
    const integ = p.L.find(r => r.tipo === 'integ'), rec = p.L.filter(r => r.tipo === 'recic').sort((a, b) => a.data < b.data ? 1 : -1)[0];
    const valRec = rec ? isoD(addM(pD(rec.data), 12)) : integ ? isoD(addM(pD(integ.data), 12)) : null;
    const nrs = p.L.filter(r => r.tipo === 'nr');
    const st = !integ ? 'venc' : valSt(valRec);
    return Object.assign(p, { integ, rec, valRec, nrs, st });
  }).sort((a, b) => ({ venc: 0, viag: 1, sem: 2, ok: 3 }[a.st] - { venc: 0, viag: 1, sem: 2, ok: 3 }[b.st]) || a.nome.localeCompare(b.nome));
}
function vTrein() {
  const P = treinPessoas(), n = s => P.filter(p => p.st === s).length;
  const ult = recs('trein').sort((a, b) => a.data < b.data ? 1 : -1).slice(0, 12);
  return `<div class="vh"><div><h1>Treinamentos</h1><p>Integração antes da primeira operação (8 h), reciclagem anual (4 h) e treinamento pós-falha Crítica ou Alta (2 h, focado na causa raiz), conforme a NP 055 item 10. A lista de presença e o certificado continuam com o SESMT (10.5); aqui fica o controle de validade.</p></div><span class="sp"></span><button class="mbtn pri" data-treinnovo>＋ Registrar treinamento</button></div>
   <div class="kgrid six"><div class="card mini"><b>${P.length}</b><span>pessoas com registro</span></div><div class="card mini ${n('venc') ? 'bad' : 'ok'}"><b>${n('venc')}</b><span>sem integração ou com reciclagem vencida</span></div><div class="card mini ${n('viag') ? 'warn' : 'ok'}"><b>${n('viag')}</b><span>reciclagem vence em 30 dias</span></div><div class="card mini ok"><b>${n('ok')}</b><span>em dia</span></div></div>
   <div class="card"><div class="row"><h2>Situação por colaborador</h2></div>
    ${P.length ? `<div class="tw"><table class="t"><thead><tr><th>Pessoa</th><th>Função</th><th>Integração</th><th>Reciclagem anual</th><th>NRs e cursos</th></tr></thead><tbody>${P.map(p => `<tr><td><b>${esc(p.nome)}</b>${p.barco ? `<div class="note">${esc(p.barco)}</div>` : ''}</td><td>${esc(p.funcao || '')}</td><td>${p.integ ? '<span class="pill p-ok">' + brD(p.integ.data) + '</span>' : '<span class="pill p-bad">não registrada</span>'}</td><td>${p.valRec ? valPill(p.valRec, 'válida até') : '—'}</td><td>${p.nrs.map(r => `<span class="pill ${valSt(r.validade) === 'venc' ? 'p-bad' : 'p-mut'}" style="margin:1px" data-tip="${esc(r.tema + (r.validade ? ' · validade ' + brD(r.validade) : ''))}">${esc(r.tema.split(' ')[0] || 'curso')}</span>`).join('') || '—'}</td></tr>`).join('')}</tbody></table></div>` : '<div class="note">Nenhum treinamento registrado ainda.</div>'}</div>
   ${ult.length ? `<div class="card"><div class="row"><h2>Últimos registros</h2></div><div class="tw"><table class="t"><thead><tr><th>Data</th><th>Pessoa</th><th>Tipo</th><th>Tema</th><th>Carga</th><th>Ministrante</th><th></th></tr></thead><tbody>${ult.map(r => `<tr><td class="mono">${brD(r.data)}</td><td>${esc(r.pessoa)}</td><td>${TREIN_N[r.tipo]}</td><td>${esc(r.tema || '')}</td><td class="mono">${r.horas ? r.horas + ' h' : '—'}</td><td>${esc(r.ministrante || '')}</td><td>${r.url ? `<a class="mbtn sm" href="${esc(r.url)}" target="_blank" rel="noopener">Evidência</a>` : ''} <button class="mbtn sm" data-treined="${r.id}">Editar</button></td></tr>`).join('')}</tbody></table></div></div>` : ''}`;
}
AFTER.trein = () => { $('#main').onclick = e => { if (e.target.closest('[data-treinnovo]')) { treinModal(); return; } const ed = e.target.closest('[data-treined]'); if (ed) treinModal(S.recs.get(ed.dataset.treined)); }; };
function treinModal(r) {
  if (!precisa(false)) return;
  const o = r || { tipo: 'recic', data: isoD(hoje()) };
  modal(`<h2>${r ? 'Editar treinamento' : 'Registrar treinamento'}</h2><p class="note">Para registrar a turma inteira, escreva um nome por linha.</p>
   <div class="g"><label class="f s3">${r ? 'Pessoa' : 'Pessoa(s)'}${r ? `<input id="rP" value="${esc(o.pessoa)}">` : '<textarea id="rP" rows="3"></textarea>'}</label>
    <label class="f s3">Função<select id="rF">${FUNCOES.map(f => `<option${o.funcao === f ? ' selected' : ''}>${f}</option>`).join('')}</select></label>
    <label class="f s2">Tipo<select id="rT">${TREIN_TIPOS.map(t => `<option value="${t[0]}"${o.tipo === t[0] ? ' selected' : ''}>${t[1]}</option>`).join('')}</select></label><label class="f s2">Data<input id="rD" type="date" value="${esc(o.data)}"></label><label class="f s2">Carga (h)<input id="rH" inputmode="decimal" value="${esc(o.horas || '')}"></label>
    <label class="f s4">Tema / NR<input id="rM" value="${esc(o.tema || '')}" placeholder="ex.: NR-10 básico, resposta a emergências, RNC 2026-033"></label><label class="f s2">Validade (NR/curso)<input id="rV" type="date" value="${esc(o.validade || '')}"></label>
    <label class="f s3">Empurrador<select id="rB"><option value="">—</option>${S.cfg.frota.map(v => `<option${o.barco === v.nome ? ' selected' : ''}>${esc(v.nome)}</option>`).join('')}</select></label><label class="f s3">Ministrante<input id="rI" value="${esc(o.ministrante || '')}" placeholder="SESMT, Supervisor, Assist. técnica"></label>
    <label class="f s6">Link da evidência (lista de presença, certificado no Drive)<input id="rU" value="${esc(o.url || '')}" placeholder="https://"></label></div>
   <div class="note" id="rErr" style="color:var(--badt)"></div>
   <div class="row end">${r && can.admin() ? '<button class="mbtn" id="rX">Excluir</button><span class="sp"></span>' : ''}<button class="mbtn" data-close>Cancelar</button><button class="mbtn pri" id="rOk">Salvar</button></div>`, true);
  const hDef = () => { const t = TREIN_TIPOS.find(t => t[0] === $("#rT").value); $("#rH").value = t[3] || ""; };
  $('#rT').onchange = hDef; if (!r) hDef();
  const x = $('#rX'); if (x) x.onclick = () => confirmar('Excluir este registro?', async () => { r.excluido = true; await saveRec(r); closeModal(); render(); });
  $('#rOk').onclick = async () => {
    const nomes = $('#rP').value.split('\n').map(s => s.trim()).filter(Boolean), d = $('#rD').value, tipo = $('#rT').value;
    if (!nomes.length) { $('#rErr').textContent = 'Informe a pessoa.'; return; } if (!d) { $('#rErr').textContent = 'Informe a data.'; return; }
    if (tipo === 'posf' && !$('#rM').value.trim()) { $('#rErr').textContent = 'No pós-falha, informe a RNC ou a falha no campo Tema.'; return; }
    const base = { funcao: $('#rF').value, tipo, data: d, horas: $('#rH').value.trim(), tema: $('#rM').value.trim(), validade: $('#rV').value, barco: $('#rB').value, ministrante: $('#rI').value.trim(), url: $('#rU').value.trim(), by: S.session.name };
    if (r) await saveRec(Object.assign(r, base, { pessoa: nomes[0] }));
    else for (const p of nomes) await saveRec(Object.assign({ id: uid('trein'), kind: 'trein', pessoa: p }, base));
    closeModal(); toast(nomes.length > 1 ? nomes.length + ' registros salvos.' : 'Treinamento salvo.'); render();
  };
}

<script>
/* =====================================================================
   CORRETIVA (Anexo II-A) SIMPLIFICADA · 5 blocos, campos conforme a classe
   ISO 9001 10.2 (reagir, causa, ação, eficácia) · ISO 14001 / 45001 (contenção)
   Os campos gravados são os mesmos de antes: indicadores, relatório e planilha continuam iguais.
   ===================================================================== */
'use strict';
// modo de falha e causa padronizados (base ISO 14224, simplificada para a frota)
const MODOS = ['Vazamento', 'Superaquecimento', 'Perda de pressão ou vazão', 'Vibração ou ruído anormal', 'Falha elétrica ou sem partida', 'Quebra ou ruptura', 'Desgaste ou folga excessiva', 'Contaminação (água, combustível, partículas)', 'Não funciona quando acionado', 'Indicação falsa ou instrumento', 'Outro'];
const CAUSAS = ['Desgaste natural (fim de vida)', 'Montagem ou instalação incorreta', 'Operação inadequada', 'Manutenção não feita ou fora do prazo', 'Peça ou material com defeito', 'Projeto ou especificação inadequada', 'Lubrificação inadequada', 'Causa externa (detrito, colisão, água do rio)', 'Causa não identificada'];
const IMPACTOS = ['Segurança da tripulação', 'Meio ambiente (vazamento / descarte)', 'Operação (parada ou atraso)', 'Sem impacto além do equipamento'];
const EF_DIAS = 90;   // verificação da eficácia: 90 dias após a liberação (ou o prazo da medida)
const efPrev = o => o.efPrev || (() => { const b = o.mitigPrazo ? pD(o.mitigPrazo) : o.liberacao ? pD(o.liberacao) : null; return b ? isoD(new Date(b.getTime() + EF_DIAS * 864e5)) : ''; })();
const ehCA = o => o.classe === 'Crítica' || o.classe === 'Alta';
const efPend = () => oms().filter(o => o.tipo === 'C' && o.status === 'encerrada' && ehCA(o) && !o.efRes && efPrev(o) && efPrev(o) <= isoD(hoje()));
const blkH = (n, t, r, cls) => `<div class="cblk-h ${cls || ''}"><b>${n}</b><div><h3>${t}</h3>${r ? `<span>${r}</span>` : ''}</div></div>`;
function formIIA(o) {
  const terc = o.exec === 'Terceiro', crit = o.classe === 'Crítica', ca = ehCA(o);
  if (crit && o.interd !== 'Sim') o.interd = 'Sim';
  return `<div class="card cblk">${blkH(1, 'Descrição da falha', 'identificação e falha (“antes”)')}<div class="g">
    <label class="f s2">Nº da OM (Sankhya)<input value="${esc(o.num)}" readonly></label><label class="f s2">Embarcação<input value="${esc(vName(o.vessel))}" readonly></label><label class="f s2">Classe<input value="${esc(o.classe)}" readonly></label>
    ${fSel(o, 'sistema', 'Sistema (7.1)', SISTEMAS, 's3')}${fIn(o, 'equip', 'Equipamento / componente', 's3')}
    <label class="f s1">Posição<input value="${POSN[o.pos]}" readonly></label>${fIn(o, 'horimetro', 'Horímetro (h)', 's1', 'inputmode="numeric"')}${fRad(o, 'local', 'Local', ['Terminal', 'Em viagem'], 's2')}${fIn(o, 'trecho', 'Trecho (se em viagem)', 's2')}
    ${fTA(o, 'descricao', 'Descrição da falha (modo de detecção, localização, sintomas)', 's6', 3)}${fSel(o, 'modo', 'Modo de falha (ISO 14224)' + (ca ? ' · obrigatório' : ''), MODOS, 's3')}
    ${fDT(o, 'abertura', 'Abertura da OM', 's2')}${fSel(o, 'origem', 'Origem', ['FR 027_L', 'Pré-operacional', 'Em viagem (Autotrac)', 'SESMT', 'Outra'], 's2')}${ca ? fIn(o, 'rnc', 'Nº da RNC (obrigatório)', 's2') : ''}
    ${ca ? fMul(o, 'comunicado', 'Comunicado imediatamente a (5.4.1)', ['Coordenação de Operações', 'Supervisão de Manutenção'], 's6') : ''}
    ${crit ? fDT(o, 'interdDT', 'Interditada desde', 's3') + fIn(o, 'interdPor', 'Interdição determinada por', 's3') : ''}</div>
    ${crit ? '<div class="banner bad">Falha Crítica: a embarcação está interditada até a liberação do Coordenador de Operações e do Supervisor de Manutenção (bloco 5).</div>' : ''}
    <details class="cdet"><summary>Parâmetros observados na hora (opcional)</summary><div class="g">${[['oleo', 'Pressão de óleo'], ['tagua', 'Temp. da água'], ['toleo', 'Temp. do óleo'], ['rpm', 'RPM'], ['bat', 'Bateria'], ['outro', 'Outro']].map(([k, l]) => fIn(o, 'par|' + k, l, 's1')).join('')}${fDT(o, 'deteccao', 'Detecção', 's2')}${fDT(o, 'comunicacao', 'Comunicação', 's2')}${fRad(o, 'meio', 'Meio', ['Autotrac', 'Telefone', 'Presencial'], 's2')}</div></details></div>

  <div class="card cblk">${blkH(2, 'Ação de contenção', 'proteger pessoas, meio ambiente e operação · ISO 9001 10.2.1 · ISO 14001 · ISO 45001', 'amb')}<div class="g">
    ${fMul(o, 'impacto', 'A falha afetou', IMPACTOS, 's6')}
    ${fTA(o, 'contencao', 'Ação de contenção executada' + (ca ? ' (obrigatório)' : ''), 's6', 2, 'ex.: motor parado, vazamento contido com absorvente, área isolada, empurrador fundeado')}
    ${fIn(o, 'pt', 'Nº da PT do SESMT (só atividade de risco · 5.11.2)', 's3', 'placeholder="N/A"')}${fIn(o, 'sesmt', 'Liberação do SESMT · responsável', 's3', 'placeholder="N/A"')}</div></div>

  <div class="card cblk">${blkH(3, 'Reparo e restabelecimento', 'execução e condição final (“depois”)')}<div class="g">
    ${fRad(o, 'exec', 'Quem executou', ['Equipe própria', 'Terceiro'], 's2')}${fIn(o, 'execn', terc ? 'Empresa e responsável técnico' : 'Nome e função', 's4')}
    ${terc ? fRad(o, 'terceiroAut', 'Autorização da Gerência (5.11.3)', ['Sim — autorização da Gerência/Diretoria', 'Não'], 's3') + fIn(o, 'scoc', 'Nº SC / OC', 's1') + fRad(o, 'relTerc', 'Relatório do fornecedor (5.8)', ['Relatório do fornecedor anexo', 'Fornecedor não emitiu — Supervisor preenche'], 's2') : ''}
    ${fDT(o, 'inicio', 'Início do reparo', 's2')}${fDT(o, 'termino', 'Término do reparo', 's2')}${fIn(o, 'rms', 'Nº das RMs', 's2')}
    ${fIn(o, 'hh', 'Horas-homem (HH)', 's2', 'inputmode="decimal"')}${fIn(o, 'custoMat', 'Custo de peças e materiais (R$)', 's2', 'inputmode="decimal"')}${fIn(o, 'custoServ', 'Custo de serviço de terceiro (R$)', 's2', 'inputmode="decimal"')}
    ${fTA(o, 'servicos', 'Serviço executado (consultar o Anexo I · 7.2)', 's6', 3)}${refeitosHTML(o)}</div>
    ${tabelaLivre(o, 'mats', 'Peças e materiais', ['Descrição', 'Qtd.', 'Nº da RM / NF', 'Lote', 'Validade'])}
    <details class="cdet"${(o.medsC || []).length ? ' open' : ''}><summary>Medições (se houver)</summary>${tabelaLivre(o, 'medsC', 'Medições', ['Medição / parâmetro', 'Especificado', 'Como encontrado', 'Como deixado', 'Unidade'])}</details>
    <div class="g">${fRad(o, 'resid', 'Gerou resíduo? (5.7)', ['Não', 'Sim'], 's2')}${fMul(o, 'residT', 'Quais (se gerou)', ['Óleo usado', 'Filtros', 'Estopas/panos', 'Metais', 'Outros'], 's2')}${fIn(o, 'fr016', 'Nº FR 016_E (se gerou)', 's2')}
    ${fIn(o, 'teste', 'Teste funcional para liberação', 's4')}${fRad(o, 'resultado', 'Resultado', ['Conforme', 'Não conforme'], 's2')}${fIn(o, 'inspecao', 'Nova inspeção de segurança (5.4.1) · responsável', 's6')}</div>

<script>
/* =====================================================================
   NÍVEL TÉCNICO · modo de falha e causa (ISO 14224), laudo de óleo,

'use strict';
const numv = v => { const x = parseFloat(String(v == null ? '' : v).replace(/\./g, '').replace(',', '.')); return isNaN(x) ? 0 : x; };

/* ---------- 1 · análise de falhas por modo e causa ---------- */
function tecFalhas(meses, fim) {
  fim = fim || hoje(); const ini = addM(fim, -meses);
  const F = oms().filter(o => o.tipo === 'C' && o.abertura && pD(o.abertura) >= ini && pD(o.abertura) < fim);
  const cont = k => { const c = {}; F.forEach(o => { const x = o[k] || 'Não classificado'; c[x] = (c[x] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1]); };
  const sisN = s => String(s || '?').replace(/^\d+\.0 /, '').replace('Sistema de ', '').replace('Manobrabilidade e Governo', 'Governo').replace('Geração Elétrica de Bordo', 'Geração').replace('Alimentação de Combustível', 'Combustível').replace('Salvaguarda e Flutuabilidade', 'Salvaguarda').replace('Sinalização e Comunicação', 'Comunicação').replace('Resposta a Emergências', 'Emergências');
  const mat = {}; F.forEach(o => { const s = sisN(o.sistema), m = o.modo || 'Não classificado'; (mat[s] = mat[s] || {})[m] = (mat[s][m] || 0) + 1; });
  return { F, modos: cont('modo'), causas: cont('causaCat'), mat, sisN, semClass: F.filter(o => !o.modo).length };
}
function tecFalhasCard() {
  const T = tecFalhas(12), mods = T.modos.map(m => m[0]).filter(m => m !== 'Não classificado').slice(0, 6), sis = Object.keys(T.mat).sort((a, b) => Object.values(T.mat[b]).reduce((x, y) => x + y, 0) - Object.values(T.mat[a]).reduce((x, y) => x + y, 0));
  const mx = Math.max(1, ...sis.flatMap(s => mods.map(m => T.mat[s][m] || 0)));
  return `<div class="two"><div class="card"><div class="row"><h2>D · Modo de falha (ISO 14224)</h2><span class="sp"></span><span class="note">12 meses · todas as classes</span></div>${hbar(T.modos.slice(0, 8), '')}${T.semClass ? `<p class="note">${T.semClass} corretiva(s) sem modo de falha. Preencha no bloco 1 da corretiva.</p>` : ''}</div>

/* ---------- leitura do painel → total ---------- */
function horCalc(vid, pos, painel, date) {
  const off = horOff(vessel(vid), pos, date);   // horímetro trocado/consertado: total na troca + leitura do novo − leitura inicial
  if (off && painel != null && !(painel >= VOLTA) && !(painel < off.ini)) { const total = Math.round((off.base + painel - off.ini) * 10) / 10, real = (() => { const x = horAtual(vid, pos); return x && !x.est ? x : null; })();
    const delta = real ? Math.round((total - real.h) * 10) / 10 : null, dias = real ? Math.max(0, (pD(date) - pD(real.date)) / 864e5) : null;
    return { total, delta, dias, virou: false, susp: real && delta < 0 ? 'menor que a última leitura (' + nf(real.h) + ' h)' : '', real }; }
  const last = horAtual(vid, pos), real = last && !last.est ? last : null;
  if (painel == null) return null;
  if (painel >= VOLTA) { // digitou o total
    const delta = real ? Math.round((painel - real.h) * 10) / 10 : null, dias = real ? Math.max(0, (pD(date) - pD(real.date)) / 864e5) : null;
    const susp = real ? (delta < 0 ? 'menor que a última leitura (' + nf(real.h) + ' h)' : delta > 24 * Math.max(dias, 0.5) + 2 ? nf(delta) + ' h em ' + Math.round(dias) + ' dia(s): mais do que 24 h/dia' : '') : '';
    return { total: painel, delta, dias, virou: false, total_digitado: true, susp, real };
  }
  if (!real) return { total: null, delta: null, dias: null, virou: false, susp: 'primeira leitura deste motor: o Supervisor informa o total', real };
  let t = Math.floor(real.h / VOLTA) * VOLTA + painel, virou = false;
  if (t < real.h - 0.05) { t += VOLTA; virou = true; }
  const delta = Math.round((t - real.h) * 10) / 10, dias = Math.max(0, (pD(date) - pD(real.date)) / 864e5);
  let susp = '';
  if (date < real.date) susp = 'data anterior à última leitura (' + brD(real.date) + ')';
  else if (delta > 24 * Math.max(dias, 0.5) + 2) susp = (virou ? 'o painel teria virado e ' : '') + nf(delta) + ' h em ' + Math.round(dias) + ' dia(s): mais do que 24 h/dia';
  return { total: Math.round(t * 10) / 10, delta, dias, virou, susp, real };
}

/* ---------- OCR (Tesseract.js, carregado só quando usar) ---------- */
const OCR = Object.assign({ script: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js', workerPath: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js', corePath: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1', langPath: 'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int' }, window.SMF_OCR || {});
let _ocrW = null;
function ocrCarregar() { if (window.Tesseract) return Promise.resolve(); return new Promise((ok, err) => { const s = document.createElement('script'); s.src = OCR.script; s.onload = ok; s.onerror = () => err(new Error('ocr_indisponivel')); document.head.appendChild(s); }); }
async function ocrWorker() { if (_ocrW) return _ocrW; await ocrCarregar(); _ocrW = await Tesseract.createWorker('eng', 1, { workerPath: OCR.workerPath, corePath: OCR.corePath, langPath: OCR.langPath }); await _ocrW.setParameters({ tessedit_char_whitelist: '0123456789.,', tessedit_pageseg_mode: '6' }); return _ocrW; }
function imgCanvas(img, maxW, filtro) { const k = Math.min(1, maxW / img.width), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
  if (filtro) { const d = g.getImageData(0, 0, c.width, c.height), a = d.data; let soma = 0; for (let i = 0; i < a.length; i += 4) { const y = .299 * a[i] + .587 * a[i + 1] + .114 * a[i + 2]; a[i] = a[i + 1] = a[i + 2] = y; soma += y; }
    const med = soma / (a.length / 4), inv = med < 110; for (let i = 0; i < a.length; i += 4) { let y = a[i]; y = (y - med) * 1.8 + 128; if (inv) y = 255 - y; y = y < 0 ? 0 : y > 255 ? 255 : y; a[i] = a[i + 1] = a[i + 2] = y; } g.putImageData(d, 0, 0); }
  return c; }
function lerArquivoImg(f) { return new Promise((ok, err) => { const u = URL.createObjectURL(f), i = new Image(); i.onload = () => { ok(i); }; i.onerror = err; i.src = u; }); }
function ocrEscolher(txt, esperado) {
  const c = (txt.match(/\d[\d.,]*\d|\d/g) || []).map(s => { const t = s.replace(/[.,](?=\d{3}\b)/g, ''); const m = t.match(/^(\d{1,5})(?:[.,](\d))?/); return m ? +(m[1] + (m[2] ? '.' + m[2] : '')) : null; }).filter(x => x != null && x < VOLTA);
  if (!c.length) return null;
  if (esperado != null) c.sort((a, b) => Math.abs(a - esperado) - Math.abs(b - esperado)); else c.sort((a, b) => String(b).length - String(a).length);
  return c[0];
}
async function ocrLer(img, esperado) { const w = await ocrWorker(); let melhor = null;
  for (const filtro of [true, false]) { const { data } = await w.recognize(imgCanvas(img, 1400, filtro)); const n = ocrEscolher(data.text || '', esperado); if (n != null && (melhor == null || (esperado != null && Math.abs(n - esperado) < Math.abs(melhor - esperado)))) melhor = n; if (melhor != null && esperado == null) break; }
  return melhor; }
async function fotoParaEnvio(img) { const c = imgCanvas(img, 1280, false); return c.toDataURL('image/jpeg', .72).split(',')[1]; }
function fotoMini(img) { return imgCanvas(img, 360, false).toDataURL('image/jpeg', .6); }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;

  document.body.appendChild(ov);
  const vid = ov.querySelector('video'), msg = ov.querySelector('.cammsg');
  const parar = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
  const fechar = () => { parar(); ov.remove(); };
  const ligar = async () => { parar(); msg.style.display = 'block'; msg.textContent = 'Abrindo a câmera…';
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: face }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false }); vid.srcObject = stream; await vid.play().catch(() => { }); msg.style.display = 'none'; }

    const c = document.createElement('canvas'); c.width = vid.videoWidth; c.height = vid.videoHeight; c.getContext('2d').drawImage(vid, 0, 0);

      catch (e) { toast('Este navegador não deixou anexar a foto. Use "Da galeria".'); } }, 'image/jpeg', .9); };

<script>

  return out.sort((a, b) => ord(a) - ord(b) || (a.u ? a.u.min : 9) - (b.u ? b.u.min : 9)); }
const cmpNome = x => esc(x.v.nome) + (mcpPos(x.v).length > 1 ? ' · ' + x.pos : '');
const CF = { f: 'todas', sel: '', per: 12, hv: '' };   // filtro da matriz · motor do detalhe · período e motor do histórico
const CMP_COR = ['#1967D2', '#D93025', '#188038', '#E37400', '#A142F4', '#12B5CB', '#5F6368', '#F439A0', '#9E6A03', '#3367D6', '#1E8E3E', '#B06000', '#7B1FA2', '#00897B'];

  Object.entries(G).forEach(([g, L]) => { const o = L[0], st = o.grupo ? grpStatus(omGrupo(g)) : o.status, link = o.grupo ? `#omg/${encodeURIComponent(g)}` : `#om/${o.id}`; if (foraOp(vessel(o.vessel) || {})) return;
    if (st === 'conferencia') add(2, `OM ${esc(o.num)} · ${esc(vName(o.vessel))} · lançada, falta conferir e aprovar`, `<a class="mbtn sm pri" href="${link}">Conferir</a>`);
    else if (st === 'executada') add(2, `OM ${esc(o.num)} · ${esc(vName(o.vessel))} · executada, falta lançar o formulário que voltou`, `<a class="mbtn sm" href="${link}">Lançar</a>`);
    else { const d = Math.floor((Date.now() - (Date.parse(o.emitAt || '') || o.createdAt || Date.now())) / 864e5); if (d >= 7) add(2, `OM ${esc(o.num)} · ${esc(vName(o.vessel))} · emitida há ${d} dias: o formulário já voltou? lançar`, `<a class="mbtn sm" href="${link}">Lançar</a>`); } });   /* sem os cliques Iniciar/Terminou: a OM vai de Emitida direto ao lançamento (decisão do Supervisor, 21/10/2026) */
  const hp = recs('horp').filter(r => !r.excluido).length; if (hp) add(2, `${hp} leitura(s) de horímetro esperando a sua confirmação`, `<a class="mbtn sm" href="#hor">Confirmar</a>`);
  const ol = lubDados().filter(x => !foraOp(x.v) && olStatus(x) === 'venc').length; if (ol) add(1, `${ol} troca(s) de óleo vencida(s)`, `<a class="mbtn sm" href="#oleo">Ver</a>`);

  const am = amoDados().M.filter(x => x.s.st === 'venc' || x.extra).length; if (am) add(2, `${am} amostra(s) de óleo do MCP vencida(s) ou coleta extra`, `<a class="mbtn sm" href="#anoleo">Ver</a>`);
  // MCA sem leitura há MCA_SEM_LEITURA_D dias e sem estimativa (bloco "Horímetros na prática")

    const dias = Math.floor((hoje() - pD(r.date)) / 864e5); if (dias < MCA_SEM_LEITURA_D) return; if (situEventos(v.id).length && horasPorEstado(v.id, +pD(r.date), Date.now(), { viagem: 12, boia: 12, cais: 0 }) < 24) return;   // ficou no cais: não trabalhou
    add(2, `<b>${esc(v.nome)}</b> · ${esc(posNome(v, p))} sem leitura há ${dias} dias (horímetro danificado ou obstruído?)`, `<button class="mbtn sm" data-agest="${v.id}|${p}">Estimar</button>`); }));

/* ===== Perfil Operador (Operador de Medição / Líder): quem preenche e assina o FR 027_L de chegada e saída =====

// situação no porto / em viagem a partir do registro mais novo (FR 027_L de chegada → porto; FR 027_L de saída ou registro de saída → viagem)

  S.cfg.frota.forEach(v => { const u = ult[v.id]; if (!u) return; const atual = v.situ ? (v.situ.ts || +pD(v.situ.at)) : 0;
    if (u.ts > atual) v.situ = { st: u.st, at: u.date || isoD(new Date(u.ts)), by: u.by, ts: u.ts }; }); }
// tela do operador

/* ===== Largura do menu: arrastar a linha entre o menu e a tela (pedido do Supervisor, 24/10/2026) =====

   Fica salva neste aparelho (localStorage 'smf_side_w'); clique duplo na linha volta ao padrão (256 px). */
'use strict';
const SIDE_RZ = document.createElement('div');
function sideLargura(w) { const a = document.querySelector('.app'), side = document.getElementById('side'); if (!a || !side) return;
  if (innerWidth < 900) { a.style.removeProperty('grid-template-columns'); SIDE_RZ.style.display = 'none'; return; }
  if (w) a.style.setProperty('grid-template-columns', Math.round(w) + 'px minmax(0,1fr)', 'important'); else a.style.removeProperty('grid-template-columns');
  SIDE_RZ.style.display = ''; SIDE_RZ.style.left = (side.getBoundingClientRect().right - 4) + 'px'; }
{ const st = document.createElement('style'); st.textContent = `.side-rz{position:fixed;top:0;bottom:0;width:8px;cursor:col-resize;z-index:95}.side-rz:hover,.side-rz.on{background:linear-gradient(90deg,transparent 3px,#1A73E8 3px,#1A73E8 5px,transparent 5px)}body.rz-arrasta{cursor:col-resize;user-select:none}`; document.head.appendChild(st);
  const ler = () => { try { return +localStorage.getItem('smf_side_w') || 0; } catch (e) { return 0; } }, h = SIDE_RZ;

    const x0 = e.clientX, w0 = document.getElementById('side').getBoundingClientRect().width;
