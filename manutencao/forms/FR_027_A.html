<!--
=====================================================================
 FR 027_A – CHECK-LIST PARA INSPEÇÃO DE BALSA TANQUE · NP NAVECUNHA 024
 Versão digital do FR 027_A Rev. 04 (texto das perguntas igual ao papel;
 a numeração foi corrigida: o papel repete o 09 e pula o 29 com um "39").
 Arquivo único (HTML + CSS + JavaScript), no padrão visual do FR 027_L.

 GUIA DE EDIÇÃO RÁPIDA (Ctrl+F)
 ---------------------------------------------------------------------
 1. ITENS ......... procure "const SECOES". Cada item é [texto, inv?].
                    inv = 1 quando "SIM" é a condição ruim (ex.: fiação
                    exposta). O SMF lê as chaves "a-N" (N = nº do item).
 2. BALSAS ........ procure "const BALSAS".
 3. REVISÃO ....... procure "Rev. 04".
 4. NÃO ALTERE .... os ids #bal #dt #hr #loc #hmb #obs, name=mov,
                    td.c[data-k], table.nc, #sec-ass .sgg e .sheet:
                    o SMF (js/100-fr-027-a.js) lê o formulário por eles.
=====================================================================
-->

<style>

<body>
<div class="toolbar"><b>FR 027_A · Check-list da Balsa Tanque</b>
<span class="st" aria-live="polite"><span><b id="s-ok">0</b>conformes</span><span class="bad"><b id="s-nc">0</b>não conformes</span><span><b id="s-na">0</b>N/A</span><span><b id="s-p">0</b>pendentes</span></span>

<script>
'use strict';
/* ===== BALSAS (planilha de características principais, NP 024) ===== */
const BALSAS=['I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII','XXIV','XXV','XXVI','XXVII','XXVIII','XXIX'].map(r=>'VDA '+r);
/* ===== ITENS (texto do FR 027_A Rev. 04) · [texto, inv] — inv = 1: "SIM" é a condição ruim ===== */
const SECOES=[
 ['Sistema elétrico',[
  ['As luzes de navegação de BB (112,5° encarnada) e BE (112,5° verde) estão funcionando e prontas a operar a qualquer tempo?'],
  ['A luz de operação noturna (360° encarnada) está funcionando e pronta a operar a qualquer tempo?'],
  ['A luz de fundeio (360° branca) está funcionando e pronta a operar a qualquer tempo?'],
  ['A luz de mastro (225° branca) está funcionando e pronta a operar a qualquer tempo?'],
  ['Os refletores da área de operação estão funcionando e prontos a operar a qualquer tempo?'],
  ['As luzes da casa de bomba e praça de máquina estão funcionando?'],
  ['As tomadas de recebimento de energia (vante e ré) são apropriadas e estão funcionando?'],
  ['Existe alguma fiação elétrica exposta?',1],
  ['Existe alguma fuga de corrente, fluxo de energia indesejado/inesperado por baixa isolação?',1]]],
 ['Alarme de nível',[
  ['Existe bateria, caixa de madeira, manta de borracha e cabo PP com bornes para funcionamento do alarme de nível?'],
  ['O painel do alarme de nível está funcionando e sincronizado apontando corretamente todos os tanques?'],
  ['Todos os sensores do alarme de nível estão funcionando e pronto a operar a qualquer tempo?'],
  ['A sirene de sinalização está funcionando e pronta a operar a qualquer tempo?'],
  ['O giroflex de sinalização está funcionando e pronto a operar a qualquer tempo?']]],
 ['Convés e casco',[
  ['A escada móvel está satisfatória para utilização a qualquer tempo?'],
  ['A bandeira BRAVO está devidamente posicionada em seu suporte e sua pintura está em bom estado?'],
  ['Os descritivos das placas de advertência estão visivelmente satisfatórias?'],
  ['As identificações das escotilhas dos tanques de carga estão visíveis e corretas (identificação do tanque e volume)?'],
  ['As escotilhas e atracadores dos tanques de carga estão livres de avarias ao ponto de comprometer a estanqueidade?'],
  ['As borrachas de vedações das escotilhas dos tanques de carga estão satisfatórias para estanqueidade?'],
  ['As identificações dos tubos de medição estão visivelmente satisfatórias?'],
  ['As identificações das datas e pressões dos testes de rede e válvulas estão visivelmente satisfatórias?'],
  ['O teste de rede e teste de válvulas estão dentro da validade?'],
  ['As identificações das redes de carga e descarga estão visivelmente satisfatórias?'],
  ['Os manômetros das redes de carga / descarga estão livres de avarias e com o visor visível?'],
  ['As juntas das tomadas de carga e descarga foram substituídas?'],
  ['A identificação de capacidade da bandeja de respingo das tomadas de carga e descarga está visivelmente satisfatória?'],
  ['A identificação da parada de emergência está visivelmente satisfatória?'],
  ['Os embornais da barreira de contenção estão engraxados?'],
  ['Os corrimãos das escadas estão satisfatórios para utilização a qualquer tempo?'],
  ['As identificações dos espaços vazios, cofferdams e pique-tanques estão visivelmente satisfatórias?'],
  ['Os escotilhões e atracadores dos espaços vazios, cofferdam e pique-tanques estão livres de avarias ao ponto de comprometer a estanqueidade?'],
  ['Os atracadores das escotilhas de carga e dos escotilhões dos espaços vazios, cofferdam e pique-tanques estão engraxados?'],
  ['As borrachas de vedações dos escotilhões dos espaços vazios, cofferdams e pique-tanques estão satisfatórias para estanqueidade?'],
  ['Os escotilhões dos espaços vazios, cofferdam e pique-tanques que forem parafusados estão com parafusos completos e com borracha?'],
  ['As identificações dos suspiros dos espaços vazios estão visivelmente satisfatórias?'],
  ['As identificações dos aterramentos estão visivelmente satisfatórias?'],
  ['As barras de aterramento estão limpas?'],
  ['As identificações de tonelagem dos cabeços estão visivelmente satisfatórias?'],
  ['Os cabeços estão livres de avarias que possam comprometer a navegação?'],
  ['As identificações de calado, porto de inscrição, disco de Plimsoll, nome da embarcação e nome da empresa estão visivelmente satisfatórias?'],
  ['O costado de BB e BE, espelho de proa e popa estão livres de avarias que possam comprometer a navegação?'],
  ['Os cabos de reboque a vante e ré estão posicionados e prontos a operar a qualquer tempo?'],
  ['A embarcação está limpa de materiais das últimas operações?'],
  ['As condições de pintura da embarcação como um todo estão satisfatórias?'],
  ['Existem defensas nos bordos de BB e BE? Elas estão em bom estado ou satisfatórias para operação?']]],
 ['Sala de máquina e bomba',[
  ['A caixa de descarga molhada (inibidor de centelha) contém água e a tampa de vedação está livre de ferrugem ou algo que venha a dificultar sua retirada?'],
  ['A descarga do motor está devidamente isolada (proteção térmica)?'],
  ['A água do radiador está dentro do nível aceitável conforme instruções do fabricante?'],
  ['O óleo lubrificante do cárter do motor está dentro do nível aceitável para a próxima operação?'],
  ['O tanque de óleo do motor dispõe de visor transparente com proteção e está limpo?'],
  ['Existe bateria, caixa de madeira, manta de borracha e cabo PP com bornes para funcionamento do motor?'],
  ['Todas as partes móveis do motor, mancal e bomba estão devidamente protegidas?'],
  ['Os termômetros do mancal estão livres de avarias?'],
  ['O termômetro da bomba está livre de avaria?'],
  ['Os instrumentos do motor estão em perfeito estado de funcionamento?'],
  ['O motor está livre de vazamentos quando de seu funcionamento?'],
  ['A parada de emergência está pronta a operar a qualquer tempo?'],
  ['A casa de bomba e máquina está limpa, sem resíduo oleoso, livre de corrosão e com pintura satisfatória?'],
  ['Os embornais da casa de bombas estão engraxados?'],
  ['A identificação de capacidade da bandeja de respingo do tanque de óleo do motor está visivelmente satisfatória?'],
  ['O Diagrama Esquemático da Rede dentro da praça de máquina está em bom estado e visível?'],
  ['As instruções de funcionamento do motor (NP Navecunha 039) estão à vista na casa de máquina?']]],
 ['SESMT',[
  ['As identificações das boias salva-vidas estão visivelmente satisfatórias?'],
  ['As identificações dos extintores e validade estão visivelmente satisfatórias?'],
  ['O machado está pintado e as identificações estão visivelmente satisfatórias?'],
  ['O(s) machado(s) para emergência posicionado(s) na(s) lateral(is) da casaria de máquina e bomba está(ão) pronto(s) a operar a qualquer tempo?'],
  ['A caixa do Kit SOPEP está devidamente identificada com os dizeres “KIT SOPEP”?'],
  ['O Kit SOPEP está completo conforme relação à vista na caixa do Kit e conforme a NORMAM 02?'],
  ['Todas as boias salva-vidas dispõem de cabo de náilon formando alças, assim como cabo com retinida de 20 m de comprimento por 8 mm de diâmetro?']]]];
/* folhas: [seção, do item, até o item] (nº do item, contado de 1 a 70) */
const FOLHAS=[[[0,1,9],[1,10,14],[2,15,28]],[[2,29,46],[3,47,63]],[[4,64,70]]];
const ASS=['Operador / Inspetor','Coordenador de Logística','Coordenador de Operações'];
const ITENS=[];let n=0;SECOES.forEach(([s,L],si)=>L.forEach(([t,inv])=>ITENS.push({n:++n,s,si,t,inv:!!inv})));
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO=(k,c)=>`<img class="${c}" alt="${k==='nav'?'Navecunha':'Grupo VDA'}" src="img/logo-${k}.png" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='../img/logo-${k}.png'}">`;
const cab=()=>`<div class="sh"><div class="lg">${LOGO('nav','ln')}</div><div class="c"><b>FR 027_A – CHECK-LIST PARA INSPEÇÃO DE BALSA TANQUE</b><span>Inspeção de chegada e saída</span><span class="np">NP Navecunha 024 · Rev. 04</span></div><div class="lg">${LOGO('vda','lv')}</div></div>`;
const linha=i=>`<tr data-n="${i.n}"><td class="n">${String(i.n).padStart(2,'0')}</td><td>${e(i.t)}${i.inv?'<span class="iv" title="Aqui SIM é a condição ruim">SIM = NC</span>':''}</td><td class="c" data-k="a-${i.n}"><div class="sg3" role="radiogroup" aria-label="Item ${i.n}"><label><input type="radio" name="a-${i.n}" value="S"><span class="${i.inv?'ruim':'bom'}">SIM</span></label><label><input type="radio" name="a-${i.n}" value="N"><span class="${i.inv?'bom':'ruim'}">NÃO</span></label><label><input type="radio" name="a-${i.n}" value="NA"><span class="na">N/A</span></label></div></td></tr>`;
const bloco=([si,a,b],cont)=>`<section class="fs"><h4><span class="code">${si+1}</span>${e(SECOES[si][0])}${cont?' (continuação)':''}</h4><table class="ckt"><thead><tr><th>Item</th><th>Descrição</th><th class="c">Conformidade</th></tr></thead><tbody>${ITENS.filter(i=>i.n>=a&&i.n<=b).map(linha).join('')}</tbody></table></section>`;
const rod=(p,t)=>`<div class="sf"><span>Documento controlado pelo SGI · Toda não conformidade vira OM no Sankhya (NP 024 6.1)</span><span class="pg">Página ${p} de ${t}</span></div>`;
const ident=`<section class="fs"><h4><span class="code">ID</span>Identificação</h4><div class="g">
<div class="s3"><label class="fl" for="bal">Balsa</label><select id="bal"><option value=""></option>${BALSAS.map(b=>`<option>${b}</option>`).join('')}</select></div>
<div class="s2"><label class="fl" for="dt">Data</label><input type="date" id="dt"></div>
<div class="s2"><label class="fl" for="hr">Hora</label><input type="text" id="hr" placeholder="hh:mm"></div>
<div class="s5"><label class="fl" for="loc">Local</label><input type="text" id="loc" value="Terminal Navecunha – Manaus"></div>
<div class="s4"><label class="fl">Movimento</label><div class="opts"><label class="opt"><input type="radio" name="mov" value="chegada"><span>Chegada</span></label><label class="opt"><input type="radio" name="mov" value="saida"><span>Saída</span></label></div></div>
<div class="s4"><label class="fl" for="hmb">Horímetro do motor-bomba (h)</label><input type="text" id="hmb" inputmode="decimal" placeholder="leitura do painel"></div>
</div></section>
<div class="legend"><span><i class="ok">verde</i>conforme</span><span><i class="nok">vermelho</i>não conforme → descrever no quadro de não conformidades</span><span><i class="na">N/A</i>não se aplica</span><span>Nos itens marcados “SIM = NC” a resposta SIM é a condição ruim.</span></div>`;
const ncq=`<section class="fs" id="sec-nc"><h4><span class="code">NC</span>Não conformidades<span class="ref">Crítica impede a operação · Alta deixa com restrição (NP 024 6.1)</span></h4>
<table class="nc"><thead><tr><th>Item</th><th>O que foi encontrado</th><th class="cm" style="width:30mm">Modo de falha</th><th style="width:19mm">Criticidade</th><th style="width:20mm">Nº da OM</th></tr></thead><tbody></tbody></table>
<p class="note">Cada não conformidade vira OM no Sankhya. Itens com o mesmo nº de OM ficam numa falha só.</p></section>
<section class="fs"><h4><span class="code">OBS</span>Observações oriundas do check-list</h4><textarea id="obs" rows="5"></textarea></section>
<section class="fs" id="sec-ass"><h4><span class="code">AS</span>Assinaturas</h4><div class="sgg">${ASS.map(a=>`<div><span class="fl">${a}</span><input type="text" placeholder="Nome"><i></i></div>`).join('')}</div></section>`;
document.getElementById('folhas').innerHTML=FOLHAS.map((F,p)=>`<div class="sheet" id="pg${p+1}">${cab()}<div class="sb">${p===0?ident:''}${F.map(b=>bloco(b,p>0&&b[1]!==SECOES.slice(0,b[0]).reduce((a,s)=>a+s[1].length,0)+1)).join('')}${p===FOLHAS.length-1?ncq:''}</div>${rod(p+1,FOLHAS.length)}</div>`).join('');
const nc=i=>{const c=document.querySelector(`input[name="a-${i.n}"]:checked`);return c&&c.value!=='NA'&&(c.value==='S')===i.inv;};
function atualiza(){
 const tb=document.querySelector('table.nc tbody'),ant={};const M=window.NC_MODOS||[];document.querySelectorAll('table.nc th.cm').forEach(th=>th.style.display=M.length?'':'none');tb.querySelectorAll('tr[data-k]').forEach(tr=>ant[tr.dataset.k]=[tr.querySelector('.ncd').value,tr.querySelector('.ncc').value,tr.querySelector('.nco').value,(tr.querySelector('.ncm')||{}).value||'']);
 const L=ITENS.filter(nc);
 tb.innerHTML=L.length?L.map(i=>{const k='a-'+i.n,a=ant[k]||['',i.si===0&&i.n<=4?'Crítica':'','',''];return `<tr data-k="${k}"><td class="nci">${String(i.n).padStart(2,'0')} · ${e(i.s)} › ${e(i.t)}</td><td><input type="text" class="ncd" aria-label="O que foi encontrado" value="${e(a[0])}"></td>${M.length?`<td><select class="ncm" aria-label="Modo de falha">${['',...M].map(c=>`<option${c===a[3]?' selected':''}>${e(c)}</option>`).join('')}</select></td>`:''}<td><select class="ncc" aria-label="Criticidade">${['','Crítica','Alta','Média','Baixa'].map(c=>`<option${c===a[1]?' selected':''}>${c}</option>`).join('')}</select></td><td><input type="text" class="nco" inputmode="numeric" aria-label="Nº da OM" value="${e(a[2])}"></td></tr>`;}).join(''):`<tr class="vz"><td colspan="${M.length?5:4}">Nenhuma não conformidade marcada.</td></tr>`;
 let ok=0,na=0,p=0;ITENS.forEach(i=>{const c=document.querySelector(`input[name="a-${i.n}"]:checked`);if(!c)p++;else if(c.value==='NA')na++;else if(!nc(i))ok++;});
 document.getElementById('s-ok').textContent=ok;document.getElementById('s-nc').textContent=L.length;document.getElementById('s-na').textContent=na;document.getElementById('s-p').textContent=p;}
document.addEventListener('change',ev=>{if(ev.target.name&&/^a-\d+$/.test(ev.target.name)){const tr=ev.target.closest('tr');if(tr)tr.classList.remove('miss');atualiza();}});
function conferir(){const F=ITENS.filter(i=>!document.querySelector(`input[name="a-${i.n}"]:checked`));document.querySelectorAll('tr[data-n]').forEach(tr=>tr.classList.toggle('miss',F.some(i=>i.n==tr.dataset.n)));
 if(F.length){document.querySelector(`tr[data-n="${F[0].n}"]`).scrollIntoView({behavior:'smooth',block:'center'});alert(F.length+' item(ns) sem marcação (destacados em amarelo).');}else alert('Todos os itens marcados.');}
atualiza();
</script>
</body></html>
