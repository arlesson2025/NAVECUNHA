svg.lig{position:absolute;left:0;top:0;pointer-events:none;z-index:1}

body.edit [data-ed]{outline:1px dashed #1967D2;outline-offset:2px;cursor:text}
.aviso{display:none;background:var(--smf-bg);color:var(--smf);padding:8px 28px;font-size:13px}
body.edit .aviso{display:block}
.cov{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;white-space:nowrap;margin-right:6px}.c-ok{background:#E6F4EA;color:#137333}.c-par{background:#FEF7E0;color:#B06000}.c-falta{background:#FCE8E6;color:#C5221F}.c-fora{background:#F1F3F4;color:#5F6368}.c-div{background:#FFF4E5;color:#B45309;border:1px solid #F6C88A}
.card .cv{margin-top:8px;border-top:1px dashed #E3E6EA;padding-top:6px}.card .cv small{display:block;font-size:11.5px;color:#5F6368;margin-top:3px;line-height:1.35}.s-bad{background:#FCE8E6;color:#C5221F}.s-warn{background:#FFF4E5;color:#B45309}

const FLUXOS = [

      if (e.r === r) h = cardHTML(e, c + 1, false, FLUXOS.indexOf(f) + '.' + c); else (e.x || []).forEach((x, k) => { if (x.r === r) h = cardHTML(x, c + 1, true, FLUXOS.indexOf(f) + '.' + c + '.' + k); });
      cells += `<div class="cell" style="grid-row:${i + 1};grid-column:${c + 2}">${h}</div>`; } });
  return `<section><p class="lead">${f.lead}</p><div class="leg"><span><i class="sel s-smf">SMF</i> no sistema</span><span><i class="sel s-sk">Sankhya</i> registro oficial da OM</span><span><i class="sel s-pp">Papel</i> formulário assinado</span><span><span class="doc">doc</span> documento ou tela</span><span>◇ decisão</span><span>Cartão cinza = acontece junto com a etapa do mesmo número</span></div>

}
function ligar() {
  const w = $('.wrap'); if (!w) return; const svg = w.querySelector('svg.lig'), g = w.querySelector('.grid'); svg.setAttribute('width', g.scrollWidth); svg.setAttribute('height', g.scrollHeight);

  let d = '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5F6368"/></marker></defs>';
  for (let i = 0; i < M.length - 1; i++) { const a = pos(M[i]), b = pos(M[i + 1]), y1 = (a.t + a.b) / 2, y2 = (b.t + b.b) / 2, x1 = a.r, x2 = b.l - 2, xm = (x1 + x2) / 2;
    d += `<path d="M${x1},${y1} L${xm},${y1} L${xm},${y2} L${x2},${y2}" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#ar)"/>`; }
  w.querySelectorAll('.card .num.x').forEach(n => { const c = n.closest('.card'), m = M.find(x => x.dataset.p === c.dataset.p); if (!m) return; const a = pos(m), b = pos(c), x = (a.l + a.r) / 2;
    d += `<path d="M${x},${a.b < b.t ? a.b : a.t} L${x},${a.b < b.t ? b.t : b.b}" fill="none" stroke="#9AA0A6" stroke-width="1.4" stroke-dasharray="4 3"/>`; });
  svg.innerHTML = d;
}
function sincroniza() {   /* leva o que foi editado na tela de volta para FLUXOS */
  document.querySelectorAll('.card[data-path]').forEach(c => { const [fi, ei, xi] = c.dataset.path.split('.').map(Number), e0 = FLUXOS[fi].etapas[ei], e = xi >= 0 ? e0.x[xi] : e0;
    c.querySelectorAll('[data-ed]').forEach(el => { const k = el.dataset.ed, v = el.textContent.replace(/^→\s*/, '').trim();
      if (k === 't' || k === 'd') e[k] = v; else if (k[0] === 'n') e.n[+k.slice(1)] = v; else if (k.startsWith('dec')) e.dec[+k.slice(3)] = v; else if (k === 'vai') e.vai[0] = v; else if (k === 'cn') e.cn = v; }); });
}
function tela() { abas(); const f = FLUXOS.find(x => x.id === ABA); $('#tela').innerHTML = f ? fluxo(f) : geral(); if (f) requestAnimationFrame(ligar); PI = -1; marca(); }

function marca() { const E = passos(); document.querySelectorAll('.card').forEach(c => { const p = +c.dataset.p - 1; c.classList.toggle('at', p === PI); c.classList.toggle('feito', PI >= 0 && p < PI); });
  const e = E[PI]; if (!e) { $('#bTx').innerHTML = ABA === 'geral' ? 'Escolha um fluxo nas abas para apresentar passo a passo.' : ''; return; }
  const at = document.querySelector(`.card[data-p="${PI + 1}"]`); if (at) at.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  $('#bTx').innerHTML = `<b>${PI + 1} de ${E.length} · ${esc(e.t)}</b><small>${esc(RAIAS[e.r][0])} · ${SIS[e.s][0]}${e.d ? ' · ' + esc(e.d) : ''}${e.n ? ' · ' + e.n.map(esc).join(' · ') : ''}</small>`; }
function apresentar(on) { document.body.classList.toggle('pres', on); if (on) { if (ABA === 'geral') { ABA = FLUXOS[0].id; tela(); } PI = 0; } else PI = -1; marca(); }
function anda(d) { const E = passos(); if (!document.body.classList.contains('pres')) return; PI = Math.max(0, Math.min(E.length - 1, PI + d));
  if (d > 0 && PI === E.length - 1 && document.querySelector(`.card.at[data-p="${E.length}"]`)) { const i = FLUXOS.findIndex(x => x.id === ABA); if (i < FLUXOS.length - 1) { ABA = FLUXOS[i + 1].id; tela(); document.body.classList.add('pres'); PI = 0; } }
  marca(); }
document.addEventListener('click', e => { const a = e.target.closest('[data-aba]'); if (a) { if (document.body.classList.contains('edit')) sincroniza(); ABA = a.dataset.aba; const p = document.body.classList.contains('pres'); tela(); if (p && ABA !== 'geral') { PI = 0; marca(); } } });
$('#bAp').onclick = () => apresentar(!document.body.classList.contains('pres'));

$('#bBx').onclick = () => { sincroniza(); const sc = document.querySelector('script'), t0 = sc.textContent, i = t0.indexOf('const FLUXOS = '), j = t0.indexOf('\nconst VISAO');
  sc.textContent = t0.slice(0, i) + 'const FLUXOS = ' + JSON.stringify(FLUXOS, null, 1) + ';' + t0.slice(j);
