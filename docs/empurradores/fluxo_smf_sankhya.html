<!DOCTYPE html>
<!--
 FLUXO DA MANUTENÇÃO · SMF × SANKHYA (versão para apresentação, 22/10/2026)
 Conteúdo aprovado pelo Supervisor no chat. Os fluxos ficam no objeto FLUXOS (no fim do arquivo):
 cada etapa tem raia (quem faz), título (verbo + objeto), sistema, documento, notas e decisão.
 "Editar" deixa os textos editáveis e "Baixar HTML" salva o arquivo com as alterações.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxo SMF × Sankhya</title>
<style>
:root{--navy:#16244A;--smf:#1967D2;--smf-bg:#E8F0FE;--sk:#7B1FA2;--sk-bg:#F3E8FD;--pp:#5F6368;--pp-bg:#F1F3F4;--ok:#188038;--warn:#B06000;--warn-bg:#FEF7E0;--bad:#C5221F;--bad-bg:#FCE8E6;--line:#DADCE0;--mut:#5F6368;--bg:#F6F7F9}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;color:#202124;background:var(--bg)}
header{background:var(--navy);color:#fff;padding:16px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:600}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
header .sp{flex:1}
.bt{font:inherit;font-size:13px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:6px;padding:7px 14px;cursor:pointer}
.bt.pri{background:#fff;color:var(--navy);border-color:#fff;font-weight:600}
.bt:hover{opacity:.9}
nav{display:flex;gap:4px;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}
nav button{font:inherit;font-size:14px;border:0;background:none;padding:13px 16px;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}
nav button.on{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
main{padding:22px 28px 40px}
.lead{font-size:15px;color:#3C4043;margin:0 0 16px;max-width:980px}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin:0 0 14px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.sel{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:4px;white-space:nowrap}
.s-smf{background:var(--smf-bg);color:var(--smf)}.s-sk{background:var(--sk-bg);color:var(--sk)}.s-pp{background:var(--pp-bg);color:var(--pp)}
.doc{display:inline-block;font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:#3C4043;background:#fff;white-space:nowrap}
/* visão geral */
.ciclo{display:flex;gap:0;margin:8px 0 22px;flex-wrap:wrap}
.ch{flex:1;min-width:170px;background:#fff;border:1px solid var(--line);padding:18px 18px 16px 30px;position:relative;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,0 100%,22px 50%)}
.ch:first-child{clip-path:polygon(0 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,0 100%);padding-left:20px}
.ch b{display:block;font-size:19px;color:var(--navy)}
.ch .n{font-size:12px;font-weight:700;color:var(--smf);letter-spacing:.4px}
.ch small{display:block;font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.35}
.sis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:1100px}
.sis div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sis h3{margin:6px 0 4px;font-size:15px}.sis p{margin:0;font-size:13px;color:#3C4043;line-height:1.45}
.frota{margin-top:14px;max-width:1100px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--smf);border-radius:8px;padding:12px 16px;font-size:13.5px}
/* raias */
.wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;position:relative}
.grid{display:grid;position:relative;min-width:max-content}
.lane{grid-column:1;background:#FAFBFC;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px;font-size:13px;font-weight:600;color:var(--navy);display:flex;align-items:center;position:sticky;left:0;z-index:3}
.lane small{display:block;font-weight:400;color:var(--mut);font-size:11.5px}
.cell{border-bottom:1px solid #EEF0F2;padding:12px 10px;display:flex;align-items:center;justify-content:center;min-height:96px}
.card{position:relative;z-index:2;width:205px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px 11px;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:opacity .25s,transform .25s,box-shadow .25s}
.card.smf{border-color:#A8C7FA}.card.sk{border-color:#D7AEFB;background:#FCF8FF}.card.pp{border-color:#C4C7C5}
.card .num{position:absolute;top:-11px;left:10px;background:var(--navy);color:#fff;font-size:11.5px;font-weight:700;border-radius:11px;padding:2px 8px}
.card .num.x{background:#80868B}
.card .t{font-size:14px;font-weight:700;line-height:1.3;margin:4px 0 7px}
.card .bd{display:flex;gap:5px;flex-wrap:wrap}
.card ul{margin:7px 0 0;padding-left:16px;font-size:12px;color:#3C4043;line-height:1.4}
.card .dec{margin-top:8px;background:var(--warn-bg);border:1px solid #F6D58A;border-radius:6px;padding:6px 8px;font-size:12px;line-height:1.4}
.card .dec b{color:var(--warn)}
.card .vai{margin-top:7px;font-size:12px;font-weight:600;color:var(--bad)}
.card .vai.ok{color:var(--smf)}
svg.lig{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
/* apresentação */
body.pres .card{opacity:.22}
body.pres .card.at{opacity:1;transform:scale(1.06);box-shadow:0 6px 22px rgba(22,36,74,.25);border-color:var(--navy)}
body.pres .card.feito{opacity:.55}
.barra{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:14px 28px;z-index:20;align-items:center;gap:16px}
body.pres .barra{display:flex}
.barra .tx{flex:1;font-size:16px}.barra .tx small{display:block;font-size:12.5px;opacity:.8;margin-top:2px}
body.edit [data-ed]{outline:1px dashed #1967D2;outline-offset:2px;cursor:text}
.aviso{display:none;background:var(--smf-bg);color:var(--smf);padding:8px 28px;font-size:13px}
body.edit .aviso{display:block}
@media print{header .bt,nav,.barra,.aviso{display:none!important}body{background:#fff}main{padding:8px}.wrap{border:0;overflow:visible}section{page-break-after:always}section[hidden]{display:block!important}@page{size:A4 landscape;margin:8mm}}
</style>
</head>
<body>
<header>
  <div><h1>Fluxo da manutenção · SMF × Sankhya</h1><p>NP Navecunha 055 · quem faz, em qual sistema e com qual documento</p></div>
  <span class="sp"></span>
  <button class="bt pri" id="bAp">▶ Apresentar</button>
  <button class="bt" id="bPr">Imprimir / PDF</button>
  <button class="bt" id="bEd">Editar</button>
  <button class="bt" id="bBx" hidden>Baixar HTML</button>
</header>
<div class="aviso">Modo de edição: clique nos textos marcados para alterar. Depois clique em "Baixar HTML" para salvar o arquivo com as alterações.</div>
<nav id="abas"></nav>
<main id="tela"></main>
<div class="barra"><div class="tx" id="bTx"></div><button class="bt" id="bAnt">← Anterior</button><button class="bt pri" id="bProx">Próximo →</button><button class="bt" id="bSai">Sair (Esc)</button></div>

<script>
const RAIAS = {
  sup: ['Supervisor de Manutenção', 'programa, lança, confere e encerra'],
  eq:  ['Equipe de manutenção / terceiro', 'executa no porto (NP 5.8)'],
  bo:  ['Bordo', 'Comandante ou Coord. de Operações'],
  ctf: ['CTF / MFM', 'troca de óleo, itens embarcados, viagem'],
  op:  ['Operador de Medição / Líder', 'FR 027_L no terminal']
};
const SIS = { smf: ['SMF', 's-smf'], sk: ['Sankhya', 's-sk'], pp: ['Papel', 's-pp'] };
const FLUXOS = [
 { id: 'prev', nome: '1 · Preventiva', lead: 'Do plano (Anexo I) até a OM encerrada no Sankhya com a evidência anexada.', raias: ['sup', 'eq', 'ctf', 'bo'], etapas: [
  { r: 'sup', t: 'Programar a preventiva', s: 'smf', d: '2 · Programar preventiva', n: ['Vencidos, do mês e embarcados já vêm marcados'] },
  { r: 'sup', t: 'Abrir a OM', s: 'sk', d: 'nº da OM', n: ['Com o texto gerado pelo SMF'] },
  { r: 'sup', t: 'Emitir o formulário', s: 'smf', d: 'Anexo II-B' },
  { r: 'eq', t: 'Executar o serviço no porto', s: 'pp', d: 'Anexo II-B', x: [{ r: 'ctf', t: 'Itens embarcados em viagem', s: 'pp', d: 'hora-alvo', n: ['CTF/MFM faz a bordo'] }] },
  { r: 'bo', t: 'Receber o serviço', s: 'pp', d: 'assina o Anexo II-B' },
  { r: 'sup', t: 'Lançar o formulário', s: 'smf', d: '3 · Executar e lançar', n: ['Foto do formulário assinado', 'OK / NOK por item'], dec: ['Algum NOK?', 'Sim → vira falha e segue para a Corretiva'] },
  { r: 'sup', t: 'Conferir e encerrar', s: 'smf', d: '4 · Conferir e encerrar', n: ['O cronograma recebe o realizado'] },
  { r: 'sup', t: 'Anexar o PDF e encerrar a OM', s: 'sk', d: 'PDF do Anexo II-B', fim: true }
 ]},
 { id: 'corr', nome: '2 · Corretiva', lead: 'Da falha detectada até o reparo encerrado e a eficácia verificada.', raias: ['op', 'sup', 'ctf', 'eq', 'bo'], etapas: [
  { r: 'op', t: 'Detectar a falha', s: 'pp', d: 'FR 027_L (NO)', n: ['O SMF registra como falha sem OM'], x: [{ r: 'sup', t: 'NOK da preventiva', s: 'smf', d: 'lançamento' }, { r: 'ctf', t: 'Avaria em viagem', s: 'smf', d: '⚠ Avaria' }] },
  { r: 'sup', t: 'Classificar a criticidade', s: 'smf', d: 'NP 5.5.1', n: ['Crítica, Alta, Média ou Baixa'], dec: ['Efeito na saída', 'Crítica bloqueia · Alta restringe'] },
  { r: 'sup', t: 'Abrir a OM corretiva', s: 'sk', d: 'nº da OM', n: ['O prazo de início conta daqui'] },
  { r: 'sup', t: 'Informar o nº da OM', s: 'smf', d: 'Anexo II-A' },
  { r: 'eq', t: 'Executar o reparo', s: 'pp', d: 'Anexo II-A', n: ['Fotos de antes e depois', 'Causa da falha'] },
  { r: 'bo', t: 'Receber o serviço', s: 'pp', d: 'assina o Anexo II-A' },
  { r: 'sup', t: 'Conferir e encerrar', s: 'smf', d: '4 · Conferir e encerrar', n: ['Serviço do Anexo I refeito por completo: o vencimento conta dali'] },
  { r: 'sup', t: 'Anexar o PDF e encerrar a OM', s: 'sk', d: 'PDF do Anexo II-A' },
  { r: 'sup', t: 'Verificar a eficácia', s: 'smf', d: '90 dias', n: ['Crítica e Alta'], fim: true }
 ]},
 { id: 'porto', nome: '3 · Porto e viagem', lead: 'O ciclo do empurrador: chegada, óleo, preventiva, saída e acompanhamento em viagem.', raias: ['op', 'bo', 'ctf', 'sup'], etapas: [
  { r: 'op', t: 'Registrar a chegada', s: 'pp', d: 'FR 027_L de chegada', n: ['CTF atesta · Coord. de Operações valida', 'Horímetros entram no SMF', 'NO com nº vira corretiva; sem nº fica pendente'] },
  { r: 'ctf', t: 'Trocar o óleo', s: 'pp', d: 'FR 049_B', n: ['O Supervisor recebe', 'Popa e motobomba 5 HP: a cada saída'] },
  { r: 'sup', t: 'Programar e executar a preventiva', s: 'smf', d: '2 → 3 → 4', vai: ['Fluxo 1 · Preventiva', 'ok'] },
  { r: 'op', t: 'Registrar a saída', s: 'pp', d: 'FR 027_L de saída', dec: ['Situação na saída', 'Liberada → confirmar · Com restrição → justificativa + foto · Bloqueada → justificativa + Coord. de Operações que autorizou + foto'] },
  { r: 'ctf', t: 'Acompanhar a viagem', s: 'smf', d: 'parâmetros do MCP', n: ['MFM informa por rádio ou WhatsApp', 'O Supervisor lança no SMF'], vai: ['Avaria → Fluxo 2 · Corretiva'] },
  { r: 'op', t: 'Voltar ao porto', s: 'pp', d: 'recomeça no 1', fim: true }
 ]}
];
const VISAO = { nome: 'Visão geral' };
const $ = s => document.querySelector(s);
let ABA = 'geral', PI = -1;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function abas() { $('#abas').innerHTML = [['geral', 'Visão geral'], ...FLUXOS.map(f => [f.id, f.nome])].map(([id, n]) => `<button data-aba="${id}" class="${ABA === id ? 'on' : ''}">${n}</button>`).join(''); }
function geral() {
  const C = [['Chegada', 'FR 027_L de chegada', 'Operador/Líder no terminal · horímetros e não conformidades entram no SMF', 'no terminal'],
    ['Programar', '2 · Programar preventiva', 'Supervisor monta a OM com o que venceu e o que vence no mês e abre no Sankhya', 'menu 2'],
    ['Executar', '3 · Executar e lançar', 'Equipe executa, bordo recebe e assina, Supervisor lança o formulário', 'menu 3'],
    ['Conferir', '4 · Conferir e encerrar', 'Supervisor confere no SMF, anexa o PDF e encerra a OM no Sankhya', 'menu 4'],
    ['Saída', 'FR 027_L de saída', 'O SMF calcula: liberada, com restrição ou bloqueada', 'no terminal']];
  return `<section><p class="lead">O SMF organiza o trabalho da manutenção da frota na ordem em que ele acontece. O Sankhya continua sendo o registro oficial da OM: número, compras e encerramento com a evidência anexada.</p>
   <div class="ciclo">${C.map(c => `<div class="ch"><span class="n">${c[3].toUpperCase()}</span><b>${c[0]}</b><span class="doc" style="margin-top:6px">${c[1]}</span><small>${c[2]}</small></div>`).join('')}</div>
   <div class="sis"><div><span class="sel s-smf">SMF</span><h3>Fluxo e controle</h3><p>O que vence, o que está aberto, quem precisa fazer o quê, situação de cada empurrador, horímetros, óleo e indicadores.</p></div>
    <div><span class="sel s-sk">Sankhya</span><h3>Registro oficial da OM</h3><p>Número da OM, compras e requisições, encerramento com o PDF do Anexo II anexado. Vale para a auditoria.</p></div>
    <div><span class="sel s-pp">Papel</span><h3>Formulários assinados</h3><p>FR 027_L, Anexo II-A/II-B e FR 049_B. A foto ou o PDF assinado volta para o SMF.</p></div></div>
   <div class="frota"><b>1 · Frota</b> é a tela de todo dia: mostra o que precisa de você agora, os empurradores no porto e em viagem e a situação de cada um. A ficha de cada empurrador abre pelo nome.</div></section>`;
}
function cardHTML(e, num, extra, path) {
  const s = SIS[e.s] || SIS.smf;
  return `<div class="card ${e.s}" data-p="${num}" data-path="${path}"><span class="num${extra ? ' x' : ''}">${extra ? num + '·' : num}</span>
    <div class="t" data-ed="t">${esc(e.t)}</div><div class="bd"><span class="sel ${s[1]}">${s[0]}</span>${e.d ? `<span class="doc" data-ed="d">${esc(e.d)}</span>` : ''}</div>
    ${e.n ? `<ul>${e.n.map((x, j) => `<li data-ed="n${j}">${esc(x)}</li>`).join('')}</ul>` : ''}
    ${e.dec ? `<div class="dec">◇ <b data-ed="dec0">${esc(e.dec[0])}</b><br><span data-ed="dec1">${esc(e.dec[1])}</span></div>` : ''}
    ${e.vai ? `<div class="vai${e.vai[1] ? ' ' + e.vai[1] : ''}" data-ed="vai">→ ${esc(e.vai[0])}</div>` : ''}
    ${e.fim ? '<div class="vai ok">■ Fim</div>' : ''}</div>`;
}
function fluxo(f) {
  const R = f.raias, N = f.etapas.length;
  let cells = R.map((r, i) => `<div class="lane" style="grid-row:${i + 1}"><div>${RAIAS[r][0]}<small>${RAIAS[r][1]}</small></div></div>`).join('');
  R.forEach((r, i) => { for (let c = 0; c < N; c++) { const e = f.etapas[c]; let h = '';
      if (e.r === r) h = cardHTML(e, c + 1, false, FLUXOS.indexOf(f) + '.' + c); else (e.x || []).forEach((x, k) => { if (x.r === r) h = cardHTML(x, c + 1, true, FLUXOS.indexOf(f) + '.' + c + '.' + k); });
      cells += `<div class="cell" style="grid-row:${i + 1};grid-column:${c + 2}">${h}</div>`; } });
  return `<section><p class="lead">${f.lead}</p><div class="leg"><span><i class="sel s-smf">SMF</i> no sistema</span><span><i class="sel s-sk">Sankhya</i> registro oficial da OM</span><span><i class="sel s-pp">Papel</i> formulário assinado</span><span><span class="doc">doc</span> documento ou tela</span><span>◇ decisão</span><span>Cartão cinza = acontece junto com a etapa do mesmo número</span></div>
   <div class="wrap"><div class="grid" style="grid-template-columns:200px repeat(${N},232px)">${cells}</div><svg class="lig"></svg></div></section>`;
}
function ligar() {
  const w = $('.wrap'); if (!w) return; const svg = w.querySelector('svg.lig'), g = w.querySelector('.grid'); svg.setAttribute('width', g.scrollWidth); svg.setAttribute('height', g.scrollHeight);
  const wr = w.getBoundingClientRect(), pos = el => { const r = el.getBoundingClientRect(); return { l: r.left - wr.left + w.scrollLeft, r: r.right - wr.left + w.scrollLeft, t: r.top - wr.top + w.scrollTop, b: r.bottom - wr.top + w.scrollTop }; };
  const M = [...w.querySelectorAll('.card')].filter(c => !c.querySelector('.num.x')).sort((a, b) => a.dataset.p - b.dataset.p);
  let d = '<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5F6368"/></marker></defs>';
  for (let i = 0; i < M.length - 1; i++) { const a = pos(M[i]), b = pos(M[i + 1]), y1 = (a.t + a.b) / 2, y2 = (b.t + b.b) / 2, x1 = a.r, x2 = b.l - 2, xm = (x1 + x2) / 2;
    d += `<path d="M${x1},${y1} L${xm},${y1} L${xm},${y2} L${x2},${y2}" fill="none" stroke="#5F6368" stroke-width="1.6" marker-end="url(#ar)"/>`; }
  w.querySelectorAll('.card .num.x').forEach(n => { const c = n.closest('.card'), m = M.find(x => x.dataset.p === c.dataset.p); if (!m) return; const a = pos(m), b = pos(c), x = (a.l + a.r) / 2;
    d += `<path d="M${x},${a.b < b.t ? a.b : a.t} L${x},${a.b < b.t ? b.t : b.b}" fill="none" stroke="#9AA0A6" stroke-width="1.4" stroke-dasharray="4 3"/>`; });
  svg.innerHTML = d;
}
function sincroniza() {   /* leva o que foi editado na tela de volta para FLUXOS */
  document.querySelectorAll('.card[data-path]').forEach(c => { const [fi, ei, xi] = c.dataset.path.split('.').map(Number), e0 = FLUXOS[fi].etapas[ei], e = xi >= 0 ? e0.x[xi] : e0;
    c.querySelectorAll('[data-ed]').forEach(el => { const k = el.dataset.ed, v = el.textContent.replace(/^→\s*/, '').trim();
      if (k === 't' || k === 'd') e[k] = v; else if (k[0] === 'n') e.n[+k.slice(1)] = v; else if (k.startsWith('dec')) e.dec[+k.slice(3)] = v; else if (k === 'vai') e.vai[0] = v; }); });
}
function tela() { abas(); const f = FLUXOS.find(x => x.id === ABA); $('#tela').innerHTML = f ? fluxo(f) : geral(); if (f) requestAnimationFrame(ligar); PI = -1; marca(); }
function passos() { const f = FLUXOS.find(x => x.id === ABA); return f ? f.etapas : []; }
function marca() { const E = passos(); document.querySelectorAll('.card').forEach(c => { const p = +c.dataset.p - 1; c.classList.toggle('at', p === PI); c.classList.toggle('feito', PI >= 0 && p < PI); });
  const e = E[PI]; if (!e) { $('#bTx').innerHTML = ABA === 'geral' ? 'Escolha um fluxo nas abas para apresentar passo a passo.' : ''; return; }
  const at = document.querySelector(`.card[data-p="${PI + 1}"]`); if (at) at.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  $('#bTx').innerHTML = `<b>${PI + 1} de ${E.length} · ${esc(e.t)}</b><small>${esc(RAIAS[e.r][0])} · ${SIS[e.s][0]}${e.d ? ' · ' + esc(e.d) : ''}${e.n ? ' · ' + e.n.map(esc).join(' · ') : ''}</small>`; }
function apresentar(on) { document.body.classList.toggle('pres', on); if (on) { if (ABA === 'geral') { ABA = FLUXOS[0].id; tela(); } PI = 0; } else PI = -1; marca(); }
function anda(d) { const E = passos(); if (!document.body.classList.contains('pres')) return; PI = Math.max(0, Math.min(E.length - 1, PI + d));
  if (d > 0 && PI === E.length - 1 && document.querySelector(`.card.at[data-p="${E.length}"]`)) { const i = FLUXOS.findIndex(x => x.id === ABA); if (i < FLUXOS.length - 1) { ABA = FLUXOS[i + 1].id; tela(); document.body.classList.add('pres'); PI = 0; } }
  marca(); }
